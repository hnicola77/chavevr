<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaveVR - Início</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background: #f5f6fa;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* MENU SUPERIOR */
        .top-menu {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            padding: 18px 35px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        .top-menu a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        /* CONTEÚDO CENTRAL */
        .container {
            max-width: 900px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 18px;
            color: #555;
            margin-bottom: 40px;
        }

        /* BOTÕES */
        .menu-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .btn-primary {
            background: #4070f4;
            padding: 12px 30px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #2f59d3;
        }

        .btn-secondary {
            background: #888;
            padding: 12px 30px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-secondary:hover {
            background: #666;
        }
    </style>

</head>

<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/cadastro.html">Cadastrar Unidade</a>
        <a href="#">Sair</a>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">

        <h1>ChaveVR</h1>
        <p class="subtitle">
            Sistema de Gestão e Entrega de Chaves  
        </p>

        <div class="menu-buttons">
            <a href="/dashboard.html" class="btn-primary">Ir para o Dashboard</a>
            <a href="/cadastro.html" class="btn-secondary">Cadastrar Unidade</a>
        </div>

    </div>

</body>
</html>
