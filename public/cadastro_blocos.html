<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Cadastro de Blocos</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background:#f4f6f9;
            margin:0;
            font-family:Arial, sans-serif;
        }
        .top-menu {
            display:flex;
            justify-content:flex-end;
            gap:20px;
            padding:15px 30px;
            background:#fff;
            border-bottom:1px solid #ddd;
        }
        .top-menu a {
            text-decoration:none;
            color:#333;
            font-weight:bold;
        }
        .container {
            max-width:1100px;
            margin:30px auto;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,0.12);
        }
        h1, h2 {
            margin-top:0;
            color:#333;
        }
        label {
            display:block;
            margin-top:10px;
            font-weight:bold;
            color:#444;
        }
        select, input, textarea {
            width:100%;
            padding:10px;
            margin-top:5px;
            border-radius:6px;
            border:1px solid #ccc;
            font-size:14px;
        }
        textarea {
            resize:vertical;
            min-height:80px;
        }
        .row {
            display:flex;
            gap:15px;
        }
        .row > div {
            flex:1;
        }
        .btn-primary {
            background:#007bff;
            padding:10px 18px;
            border-radius:6px;
            color:white;
            border:none;
            font-weight:bold;
            cursor:pointer;
        }
        .btn-secondary {
            background:#6c757d;
            padding:10px 18px;
            border-radius:6px;
            color:white;
            border:none;
            font-weight:bold;
            cursor:pointer;
        }
        table {
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
            background:white;
        }
        th, td {
            padding:10px;
            border-bottom:1px solid #eee;
            text-align:left;
            font-size:13px;
        }
        th {
            background:#f7f7f7;
            font-weight:bold;
        }
        .btn-unidades {
            padding:6px 12px;
            background:#17a2b8;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/chavevr/dashboard.html">Dashboard</a>
        <a href="/chavevr/cadastro_empreendimentos.html">Empreendimentos</a>
        <a href="/index.html">Módulos</a>
    </div>

    <div class="container">
        <h1>Cadastro de Blocos</h1>
        <p>Selecione o empreendimento e cadastre os blocos associados a ele.</p>

        <!-- FORMULÁRIO -->
        <h2>Novo Bloco</h2>

        <form id="formBloco">

            <label>Empreendimento</label>
            <select id="selEmpBloco" required>
                <option value="">Selecione...</option>
            </select>

            <label>Nome do Bloco</label>
            <input type="text" id="nomeBloco" required>

            <label>Observações</label>
            <textarea id="obsBloco"></textarea>

            <br>
            <button class="btn-primary" type="submit">Salvar Bloco</button>
        </form>

        <!-- LISTAGEM -->
        <h2 style="margin-top:40px;">Blocos Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Bloco</th>
                    <th>Observação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaBlocos">
                <!-- preenchido via JS -->
            </tbody>
        </table>

    </div>

    <script src="/chavesvr.js"></script>
</body>
</html>
