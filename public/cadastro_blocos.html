<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Blocos</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<!-- MENU SUPERIOR -->
<div class="top-menu">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
    <a href="/cadastro_unidades.html">Unidades</a>
    <a href="/index.html">Módulos</a>
</div>

<div class="container">

    <h1>Cadastro de Blocos</h1>
    <p>Gerencie os blocos de cada empreendimento.</p>

    <h2 id="tituloForm">Novo Bloco</h2>

    <form id="formBloco">
        <input type="hidden" id="idBloco">

        <label>Empreendimento</label>
        <select id="selEmp" required></select>

        <label>Nome do Bloco</label>
        <input type="text" id="nomeBloco" required>

        <label>Observações</label>
        <textarea id="obsBloco"></textarea>

        <br>
        <button class="btn-primary" type="submit" id="btnSalvar">Salvar</button>
        <button class="btn-secondary" type="button" id="btnCancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar</button>
    </form>

    <hr style="margin:40px 0;">

    <h2>Blocos Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Bloco</th>
                <th>Observação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaBlocos"></tbody>
    </table>

</div>

<script>
/*************************************
 * HELPERS
 *************************************/
function get(id){ return document.getElementById(id); }
function qs(sel){ return document.querySelector(sel); }

function limpar() {
    get("idBloco").value = "";
    get("nomeBloco").value = "";
    get("obsBloco").value = "";
}

/*************************************
 * CARREGAR EMPREENDIMENTOS
 *************************************/
async function carregarEmpreendimentos() {
    const res = await fetch("/empreendimentos");
    const lista = await res.json();

    const sel = get("selEmp");
    sel.innerHTML = "";

    lista.forEach(emp => {
        const opt = document.createElement("option");
        opt.value = emp.id;
        opt.textContent = emp.nome;
        sel.appendChild(opt);
    });

    const url = new URLSearchParams(window.location.search);
    const empURL = url.get("emp");

    if (empURL) sel.value = empURL;
}

/*************************************
 * CARREGAR BLOCOS DO EMPREENDIMENTO
 *************************************/
async function carregarBlocos() {
    const empId = get("selEmp").value;
    const res = await fetch(`/blocos/${empId}`);
    const blocos = await res.json();

    const tbody = get("tabelaBlocos");
    tbody.innerHTML = "";

    blocos.forEach(b => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${b.id}</td>
            <td>${b.nome}</td>
            <td>${b.observacao || ""}</td>
            <td>
                <button class="btn-small btn-editar" onclick="editar(${b.id})">Editar</button>
                <button class="btn-small btn-unidades" onclick="abrirUnidades(${b.id})">Unidades</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

/*************************************
 * SALVAR BLOCO
 *************************************/
get("formBloco").addEventListener("submit", async (e) => {
    e.preventDefault();

    const bloco = {
        empreendimento_id: get("selEmp").value,
        nome: get("nomeBloco").value,
        observacao: get("obsBloco").value
    };

    const id = get("idBloco").value;

    if (id === "") {
        // Criar
        await fetch("/blocos", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(bloco)
        });
        alert("Bloco criado!");
    } else {
        // Editar
        await fetch(`/blocos/${id}`, {
            method: "PUT",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(bloco)
        });
        alert("Bloco atualizado!");
    }

    cancelarEdicao();
    carregarBlocos();
});

/*************************************
 * EDITAR BLOCO
 *************************************/
async function editar(id) {
    const empId = get("selEmp").value;

    const res = await fetch(`/blocos/${empId}`);
    const blocos = await res.json();
    const b = blocos.find(x => x.id == id);

    get("idBloco").value = b.id;
    get("nomeBloco").value = b.nome;
    get("obsBloco").value = b.observacao;

    get("tituloForm").innerText = "Editar Bloco";
    get("btnSalvar").innerText = "Atualizar";
    get("btnCancelar").style.display = "inline-block";
}

function cancelarEdicao() {
    limpar();
    get("tituloForm").innerText = "Novo Bloco";
    get("btnSalvar").innerText = "Salvar";
    get("btnCancelar").style.display = "none";
}

/*************************************
 * ABRIR UNIDADES
 *************************************/
function abrirUnidades(idBloco) {
    const empId = get("selEmp").value;
    window.location.href = `/cadastro_unidades.html?emp=${empId}&bloco=${idBloco}`;
}

/*************************************
 * INICIAR
 *************************************/
(async () => {
    await carregarEmpreendimentos();
    await carregarBlocos();

    get("selEmp").addEventListener("change", carregarBlocos);
})();
</script>

</body>
</html>
