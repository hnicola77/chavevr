<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Blocos</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>

<!-- NAV SUPERIOR -->
<div class="top-menu">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
    <a href="/cadastro_unidades.html">Unidades</a>
    <a href="/index.html">Módulos</a>
</div>

<div class="container">

    <h1 id="tituloPag">Blocos do Empreendimento</h1>
    <p id="subtituloPag"></p>

    <!-- FORMULÁRIO -->
    <h2 id="formTitulo">Novo Bloco</h2>

    <form id="formBloco">
        <input type="hidden" id="blocoId">
        <input type="hidden" id="empId">

        <label>Nome do Bloco</label>
        <input type="text" id="nomeBloco" required>

        <label>Observações</label>
        <textarea id="obsBloco"></textarea>

        <br>
        <button type="submit" class="btn-primary" id="btnSalvarBloco">Salvar</button>
        <button type="button" class="btn-secondary" id="btnCancelarBloco" style="display:none;" onclick="cancelarEdicaoBloco()">Cancelar</button>
    </form>

    <hr style="margin:40px 0;">

    <!-- LISTAGEM -->
    <h2>Blocos Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Bloco</th>
                <th>Observação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaBlocos"></tbody>
    </table>

</div>

<script>
// HELPERS
function get(id) { return document.getElementById(id); }

// CAPTURAR ID DO EMPREENDIMENTO
const url = new URL(window.location.href);
const empId = url.searchParams.get("emp");

if (!empId) {
    alert("Nenhum empreendimento selecionado.");
    window.location.href = "/cadastro_empreendimentos.html";
}

// INICIAR ID DO EMP NO FORM
get("empId").value = empId;

// CARREGAR NOME DO EMPREENDIMENTO
async function carregarNomeEmp() {
    const res = await fetch("/empreendimentos");
    const lista = await res.json();
    const emp = lista.find(e => e.id == empId);

    get("tituloPag").innerText = "Blocos — " + emp.nome;
    get("subtituloPag").innerText = `${emp.cidade} / ${emp.uf}`;
}

// LISTAR BLOCOS
async function carregarBlocos() {
    const res = await fetch(`/blocos/${empId}`);
    return await res.json();
}

async function preencherTabelaBlocos() {
    const lista = await carregarBlocos();
    const tbody = get("tabelaBlocos");
    tbody.innerHTML = "";

    lista.forEach(b => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${b.id}</td>
            <td>${b.nome}</td>
            <td>${b.observacao || ""}</td>
            <td>
                <button class="btn-small btn-editar" onclick="editarBloco(${b.id})">Editar</button>
                <button class="btn-small btn-unidades" onclick="abrirUnidades(${b.id})">Unidades</button>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

// ABRIR UNIDADES
function abrirUnidades(blocoId) {
    window.location.href = `/cadastro_unidades.html?emp=${empId}&bloco=${blocoId}`;
}

// SALVAR BLOCO
get("formBloco").addEventListener("submit", async (e) => {
    e.preventDefault();

    const bloco = {
        empreendimento_id: empId,
        nome: get("nomeBloco").value,
        observacao: get("obsBloco").value
    };

    const id = get("blocoId").value;

    if (id === "") {
        await fetch("/blocos", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(bloco)
        });
        alert("Bloco criado!");
    } else {
        await fetch(`/blocos/${id}`, {
            method: "PUT",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(bloco)
        });
        alert("Bloco atualizado!");
    }

    cancelarEdicaoBloco();
    preencherTabelaBlocos();
});

// EDITAR BLOCO
async function editarBloco(id) {
    const lista = await carregarBlocos();
    const bloco = lista.find(b => b.id == id);

    get("blocoId").value = bloco.id;
    get("nomeBloco").value = bloco.nome;
    get("obsBloco").value = bloco.observacao;

    get("formTitulo").innerText = "Editar Bloco";
    get("btnSalvarBloco").innerText = "Atualizar";
    get("btnCancelarBloco").style.display = "inline-block";
}

// CANCELAR
function cancelarEdicaoBloco() {
    get("blocoId").value = "";
    get("nomeBloco").value = "";
    get("obsBloco").value = "";

    get("formTitulo").innerText = "Novo Bloco";
    get("btnSalvarBloco").innerText = "Salvar";
    get("btnCancelarBloco").style.display = "none";
}

// INICIAR
carregarNomeEmp();
preencherTabelaBlocos();
</script>

</body>
</html>
