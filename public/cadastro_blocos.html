<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Blocos – ChaveVR</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/chavesvr.js"></script>
</head>

<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
    </div>

    <div class="container">

        <h1>Cadastro de Blocos</h1>
        <p id="tituloEmp" style="font-weight:bold; margin-bottom:20px;"></p>

        <!-- FORM -->
        <form id="formBloco" onsubmit="salvarBloco(event)">
            <input type="hidden" id="id" />

            <label>Nome do Bloco</label>
            <input id="nome" required>

            <label>Observações</label>
            <textarea id="observacao"></textarea>

            <button class="btn-primary" style="margin-top:20px;">Salvar</button>
        </form>

        <hr style="margin:30px 0">

        <h2>Blocos Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Bloco</th>
                    <th>Observação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaBlocos"></tbody>
        </table>

    </div>

<script>
let empId = null;

/****************************************************
 * INICIAR TELA
 ****************************************************/
document.addEventListener("DOMContentLoaded", async () => {

    // 1) Ler o ID do empreendimento via URL
    const params = new URLSearchParams(location.search);
    empId = params.get("emp");

    if (!empId) {
        alert("Nenhum empreendimento selecionado!");
        location.href = "/cadastro_empreendimentos.html";
        return;
    }

    // 2) carregar nome do empreendimento
    await carregarTituloEmpreendimento();

    // 3) listar blocos
    await listarBlocos();
});

/****************************************************
 * MOSTRAR NOME DO EMPREENDIMENTO
 ****************************************************/
async function carregarTituloEmpreendimento() {
    const res = await fetch("/empreendimentos");
    const lista = await res.json();

    const emp = lista.find(e => e.id == empId);
    if (!emp) {
        get("tituloEmp").innerText = "Empreendimento não encontrado.";
        return;
    }

    get("tituloEmp").innerText = `Empreendimento: ${emp.nome}`;
}

/****************************************************
 * LISTAR BLOCOS
 ****************************************************/
async function listarBlocos() {
    const res = await fetch(`/blocos/${empId}`);
    const lista = await res.json();

    const tbody = get("tabelaBlocos");
    tbody.innerHTML = "";

    lista.forEach(b => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${b.nome}</td>
            <td>${b.observacao || ""}</td>
            <td>
                <button class="btn-small btn-editar"
                        onclick='editar(${JSON.stringify(b)})'>
                    Editar
                </button>

                <!-- 🔥 PASSAGEM CORRETA DOS PARÂMETROS -->
                <a class="btn-small btn-unidades"
                   href="/cadastro_unidades.html?emp=${empId}&bloco=${b.id}">
                    Unidades
                </a>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

/****************************************************
 * EDITAR BLOCO
 ****************************************************/
function editar(b) {
    get("id").value = b.id;
    get("nome").value = b.nome;
    get("observacao").value = b.observacao || "";
}

/****************************************************
 * SALVAR BLOCO
 ****************************************************/
async function salvarBloco(e) {
    e.preventDefault();

    const id = get("id").value;

    const dados = {
        empreendimento_id: empId,
        nome: get("nome").value,
        observacao: get("observacao").value
    };

    const metodo = id ? "PUT" : "POST";
    const url = id ? `/blocos/${id}` : "/blocos";

    await fetch(url, {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
    });

    alert("Bloco salvo com sucesso!");

    get("formBloco").reset();
    get("id").value = "";

    listarBlocos();
}

</script>

</body>
</html>
