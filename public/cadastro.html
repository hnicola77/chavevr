<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Unidades - ChaveVR</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
    <h1>Cadastro de Unidades</h1>
    <nav>
        <a href="/index.html">Início</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/cadastro.html" class="active">Cadastrar</a>
    </nav>
</header>

<main class="container">

    <button id="addUnitBtn" class="btn primary">+ Adicionar Unidade</button>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2>Nova Unidade</h2>

            <label>Unidade</label>
            <input type="text" id="unidade">

            <label>Empreendimento</label>
            <input type="text" id="empreendimento">

            <label>Status</label>
            <select id="status">
                <option value="Pendente">Pendente</option>
                <option value="Liberada">Liberada</option>
                <option value="Bloqueada">Bloqueada</option>
            </select>

            <label>Observações</label>
            <textarea id="obs"></textarea>

            <button id="saveUnitBtn" class="btn success">Salvar</button>
            <button id="closeModalBtn" class="btn danger">Cancelar</button>
        </div>
    </div>

    <section id="unitsList"></section>

</main>

<script src="/chavesvr.js"></script>

</body>
</html>
