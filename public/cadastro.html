<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Unidade - ChaveVR</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 0;
        }

        .top-menu {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding: 15px 30px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .top-menu a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            margin-top: 12px;
            display: block;
            color: #34495e;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 8px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row div {
            flex: 1;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .btn-primary {
            background: #4070f4;
            padding: 10px 25px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-secondary {
            background: #999;
            padding: 10px 25px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

    </style>

</head>
<body>

    <!-- Menu Superior -->
    <div class="top-menu">
        <a href="/dashboard.html">Voltar</a>
        <a href="#">Relatório</a>
        <a href="#">Sair</a>
    </div>

    <div class="container">

        <h1>Cadastrar Nova Unidade</h1>

        <form id="form-cadastro">

            <label>Empreendimento</label>
            <input type="text" id="empreendimento" required>

            <div class="row">
                <div>
                    <label>Bloco</label>
                    <input type="text" id="bloco">
                </div>

                <div>
                    <label>Pavimento</label>
                    <input type="text" id="pavimento">
                </div>

                <div>
                    <label>Unidade</label>
                    <input type="text" id="unidade" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Situação</label>
                    <select id="situacao">
                        <option value="Pendente">Pendente</option>
                        <option value="Liberada">Liberada</option>
                        <option value="Reprovada">Reprovada</option>
                    </select>
                </div>

                <div>
                    <label>Status Financeiro</label>
                    <select id="status_financeiro">
                        <option value="OK">OK</option>
                        <option value="Pendente">Pendente</option>
                    </select>
                </div>

                <div>
                    <label>Habite-se</label>
                    <select id="habite_se">
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>CVCO</label>
                    <select id="cvco">
                        <option value="Liberado">Liberado</option>
                        <option value="Pendente">Pendente</option>
                    </select>
                </div>

                <div>
                    <label>Chaves Entregues</label>
                    <select id="chaves_entregues">
                        <option value="Não">Não</option>
                        <option value="Sim">Sim</option>
                    </select>
                </div>
            </div>

            <label>Agendamento da Vistoria</label>
            <div class="row">
                <div>
                    <input type="date" id="data_vistoria">
                </div>
                <div>
                    <input type="time" id="hora_vistoria">
                </div>
            </div>

            <label>Data de Liberação</label>
            <input type="date" id="data_liberacao">

            <label>Agendado por</label>
            <input type="text" id="agendado_por">

            <label>Observação</label>
            <textarea id="observacao"></textarea>

            <div class="actions">
                <button type="submit" class="btn-primary">Salvar</button>
                <a href="/dashboard.html" class="btn-secondary">Cancelar</a>
            </div>

        </form>

    </div>

    <script src="chavesvr.js"></script>

</body>
</html>
