<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Cadastro de Unidade</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #f5f6fa;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .top-menu {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding: 15px 30px;
            background: white;
            border-bottom: 1px solid #ddd;
        }
        .top-menu a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            color: #34495e;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 5px;
            font-size: 14px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row > div {
            flex: 1;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        .btn-primary {
            background: #4070f4;
            padding: 10px 25px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn-secondary {
            background: #888;
            padding: 10px 25px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/index.html">Voltar</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/">Sair</a>
    </div>

    <div class="container">
        <h1>Cadastrar Unidade</h1>

        <form id="form-cadastro">
            <label for="empreendimento">Empreendimento</label>
            <input type="text" id="empreendimento" required>

            <div class="row">
                <div>
                    <label for="bloco">Bloco</label>
                    <input type="text" id="bloco">
                </div>
                <div>
                    <label for="pavimento">Pavimento</label>
                    <input type="text" id="pavimento">
                </div>
                <div>
                    <label for="unidade">Unidade</label>
                    <input type="text" id="unidade" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="situacao">Situação</label>
                    <select id="situacao">
                        <option value="Pendente">Pendente</option>
                        <option value="Liberada">Liberada</option>
                        <option value="Reprovada">Reprovada</option>
                    </select>
                </div>
                <div>
                    <label for="statusFinanceiro">Status Financeiro</label>
                    <select id="statusFinanceiro">
                        <option value="OK">OK</option>
                        <option value="Pendente">Pendente</option>
                    </select>
                </div>
                <div>
                    <label for="habiteSe">Habite-se</label>
                    <select id="habiteSe">
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="cvco">CVCO</label>
                    <select id="cvco">
                        <option value="Liberado">Liberado</option>
                        <option value="Pendente">Pendente</option>
                    </select>
                </div>
                <div>
                    <label for="chaves">Chaves</label>
                    <select id="chaves">
                        <option value="Entregue">Entregue</option>
                        <option value="Não entregue">Não entregue</option>
                    </select>
                </div>
            </div>

            <label>Agenda da Vistoria</label>
            <div class="row">
                <div>
                    <input type="date" id="dataVistoria">
                </div>
                <div>
                    <input type="time" id="horaVistoria">
                </div>
            </div>

            <label for="dataLiberacao">Data de Liberação</label>
            <input type="date" id="dataLiberacao">

            <label for="agendadoPor">Agendado por</label>
            <input type="text" id="agendadoPor">

            <label for="observacao">Observação</label>
            <textarea id="observacao"></textarea>

            <div class="actions">
                <button type="submit" class="btn-primary">Salvar</button>
                <a href="/dashboard.html" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <script src="/chavesvr.js"></script>
</body>
</html>
