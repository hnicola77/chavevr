<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Unidades – ChaveVR</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/chavesvr.js"></script>
</head>

<body>

    <!-- MENU -->
    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
    </div>

    <div class="container">

        <h1>Cadastro de Unidades</h1>

        <p id="tituloContexto"
           style="font-weight:bold; margin-bottom:20px; font-size:16px;"></p>

        <!-- FORM -->
        <form id="formUnidade" onsubmit="salvarUnidade(event)">
            <input type="hidden" id="id" />
            <input type="hidden" id="bloco_id" />

            <label>Número da Unidade</label>
            <input id="unidade" required />

            <label>Situação</label>
            <select id="situacao">
                <option value="Em obra">Em Obra</option>
                <option value="Ajuste de cliente">Ajuste de Cliente</option>
                <option value="Liberada">Liberada</option>
                <option value="Aprovada">Aprovada</option>
            </select>

            <label>Status Financeiro</label>
            <select id="statusFinanceiro">
                <option value="Liberada">Liberada</option>
                <option value="Bloqueada">Bloqueada</option>
            </select>

            <label>Habitável</label>
            <select id="habitavel">
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>

            <label>CVCO</label>
            <select id="cvco">
                <option value="Liberado">Liberado</option>
                <option value="Não liberado">Não Liberado</option>
            </select>

            <label>Chaves</label>
            <select id="chaves">
                <option value="Entregue">Entregue</option>
                <option value="Não entregue">Não Entregue</option>
            </select>

            <div class="row">
                <div>
                    <label>Data Vistoria</label>
                    <input type="date" id="dataVistoria">
                </div>
                <div>
                    <label>Hora</label>
                    <input type="time" id="horaVistoria">
                </div>
            </div>

            <label>Data Liberação</label>
            <input type="date" id="dataLiberacao">

            <label>Agendado Por</label>
            <input id="agendadoPor">

            <label>Observações</label>
            <textarea id="observacao"></textarea>

            <button class="btn-primary" style="margin-top:20px;">Salvar</button>
        </form>

        <hr style="margin:30px 0">

        <h2>Unidades Cadastradas</h2>

        <table>
            <thead>
                <tr>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaUnidades"></tbody>
        </table>

    </div>

<script>
let blocoId = null;
let empId = null;

/**********************************************
 * INICIAR TELA
 **********************************************/
document.addEventListener("DOMContentLoaded", async () => {

    // Ler parâmetros da URL
    const params = new URLSearchParams(location.search);
    blocoId = params.get("bloco");
    empId = params.get("emp");

    if (!blocoId || !empId) {
        alert("Bloco ou Empreendimento não informado!");
        location.href = "/cadastro_empreendimentos.html";
        return;
    }

    get("bloco_id").value = blocoId;

    await carregarContexto();
    await listarUnidades();
});

/**********************************************
 * MOSTRAR O CONTEXTO (Emp + Bloco)
 **********************************************/
async function carregarContexto() {
    const resEmp = await fetch("/empreendimentos");
    const empreendimentos = await resEmp.json();
    const emp = empreendimentos.find(e => e.id == empId);

    const resBl = await fetch(`/blocos/${empId}`);
    const blocos = await resBl.json();
    const bloco = blocos.find(b => b.id == blocoId);

    get("tituloContexto").innerText =
        `Empreendimento: ${emp.nome} — Bloco: ${bloco.nome}`;
}

/**********************************************
 * LISTAR UNIDADES
 **********************************************/
async function listarUnidades() {
    const res = await fetch(`/unidades/${blocoId}`);
    const lista = await res.json();

    const tbody = get("tabelaUnidades");
    tbody.innerHTML = "";

    lista.forEach(u => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${u.unidade}</td>
            <td>${u.situacao}</td>
            <td>${u.statusFinanceiro}</td>
            <td>${u.habitavel}</td>
            <td>${u.cvco}</td>
            <td>${u.chaves}</td>
            <td>${u.dataVistoria || ""}</td>
            <td>${u.dataLiberacao || ""}</td>

            <td>
                <button class="btn-small btn-editar" onclick='editar(${JSON.stringify(u)})'>
                    Editar
                </button>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

/**********************************************
 * EDITAR UNIDADE
 **********************************************/
function editar(u) {
    get("id").value = u.id;
    get("unidade").value = u.unidade;
    get("situacao").value = u.situacao;
    get("statusFinanceiro").value = u.statusFinanceiro;
    get("habitavel").value = u.habitavel;
    get("cvco").value = u.cvco;
    get("chaves").value = u.chaves;
    get("dataVistoria").value = u.dataVistoria || "";
    get("horaVistoria").value = u.horaVistoria || "";
    get("dataLiberacao").value = u.dataLiberacao || "";
    get("agendadoPor").value = u.agendadoPor || "";
    get("observacao").value = u.observacao || "";
}

/**********************************************
 * SALVAR UNIDADE
 **********************************************/
async function salvarUnidade(e) {
    e.preventDefault();

    const id = get("id").value;

    const dados = {
        bloco_id: blocoId,
        unidade: get("unidade").value,
        situacao: get("situacao").value,
        statusFinanceiro: get("statusFinanceiro").value,
        habitavel: get("habitavel").value,
        cvco: get("cvco").value,
        chaves: get("chaves").value,
        dataVistoria: get("dataVistoria").value,
        horaVistoria: get("horaVistoria").value,
        dataLiberacao: get("dataLiberacao").value,
        agendadoPor: get("agendadoPor").value,
        observacao: get("observacao").value
    };

    const metodo = id ? "PUT" : "POST";
    const url = id ? `/unidades/${id}` : "/unidades";

    await fetch(url, {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
    });

    alert("Unidade salva com sucesso!");

    get("formUnidade").reset();
    get("id").value = "";

    listarUnidades();
}

</script>

</body>
</html>
