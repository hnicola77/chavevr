<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Unidades</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>

    <!-- NAV SUPERIOR -->
    <div class="top-menu">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
        <a href="/cadastro_blocos.html">Blocos</a>
        <a href="/index.html">Módulos</a>
    </div>

    <div class="container">

        <h1 id="tituloPag">Empreendimento → Bloco → Unidades</h1>
        <p id="subtituloPag"></p>

        <!-- FORMULÁRIO -->
        <h2 id="formTitulo">Nova Unidade</h2>

        <form id="formUnidade">

            <!-- IDs escondidos -->
            <input type="hidden" id="idUnidade">
            <input type="hidden" id="empId">
            <input type="hidden" id="blocoId">

            <label>Número da Unidade</label>
            <input type="text" id="nUnidade" required>

            <div class="row">
                <div>
                    <label>Situação</label>
                    <select id="selSituacao">
                        <option value="">Selecione</option>
                        <option value="Em obra">Em Obra</option>
                        <option value="Ajuste de cliente">Ajuste de Cliente</option>
                        <option value="Liberada">Liberada</option>
                        <option value="Aprovada">Aprovada</option>
                    </select>
                </div>

                <div>
                    <label>Status Financeiro</label>
                    <select id="selFinanceiro">
                        <option value="">Selecione</option>
                        <option value="Liberada">Liberada</option>
                        <option value="Bloqueada">Bloqueada</option>
                    </select>
                </div>

                <div>
                    <label>Habitável</label>
                    <select id="selHabitavel">
                        <option value="">Selecione</option>
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>CVCO</label>
                    <select id="selCVCO">
                        <option value="">Selecione</option>
                        <option value="Liberado">Liberado</option>
                        <option value="Não liberado">Não Liberado</option>
                    </select>
                </div>

                <div>
                    <label>Chaves</label>
                    <select id="selChaves">
                        <option value="">Selecione</option>
                        <option value="Entregue">Entregue</option>
                        <option value="Não entregue">Não Entregue</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Data da Vistoria</label>
                    <input type="date" id="dtVistoria">
                </div>
                <div>
                    <label>Hora</label>
                    <input type="time" id="hrVistoria">
                </div>
                <div>
                    <label>Data de Liberação</label>
                    <input type="date" id="dtLiberacao">
                </div>
            </div>

            <label>Agendado Por</label>
            <input type="text" id="agendadoPor">

            <label>Observação</label>
            <textarea id="obsUnidade"></textarea>

            <br>
            <button type="submit" class="btn-primary" id="btnSalvar">Salvar</button>
            <button type="button" class="btn-secondary" id="btnCancelar"
                onclick="cancelarEdicao()" style="display:none;">Cancelar</button>

        </form>

        <hr style="margin:40px 0;">

        <!-- LISTAGEM -->
        <h2 id="tituloLista">Unidades Cadastradas</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaUnidades"></tbody>
        </table>

    </div>

<script>
// HELPERS
function get(id){ return document.getElementById(id); }

// CAPTURAR PARÂMETROS
const url = new URL(window.location.href);
const empId = url.searchParams.get("emp");
const blocoId = url.searchParams.get("bloco");

get("empId").value = empId;
get("blocoId").value = blocoId;

// VALIDAR
if(!empId || !blocoId){
    alert("Selecione Empreendimento e Bloco primeiro.");
    window.location.href = "/cadastro_empreendimentos.html";
}

// CARREGAR NOME DO EMPREENDIMENTO + BLOCO
async function carregarCabecalho(){
    const listaEmp = await (await fetch("/empreendimentos")).json();
    const emp = listaEmp.find(e=>e.id == empId);

    const listaBlocos = await (await fetch(`/blocos/${empId}`)).json();
    const bloco = listaBlocos.find(b=>b.id == blocoId);

    get("tituloPag").innerText = 
        `${emp.nome} → ${bloco.nome} → Unidades`;

    get("subtituloPag").innerText = `${emp.cidade} / ${emp.uf}`;
}

// LISTAR UNIDADES
async function carregarUnidades(){
    const res = await fetch(`/unidades/${blocoId}`);
    return await res.json();
}

async function preencherTabela(){
    const lista = await carregarUnidades();
    const tbody = get("tabelaUnidades");
    tbody.innerHTML = "";

    lista.forEach(u=>{
        const tr = document.createElement("tr");
        tr.classList.add(corUnidade(u)); // verde, amarelo, vermelho

        tr.innerHTML = `
            <td>${u.id}</td>
            <td>${u.unidade}</td>
            <td>${u.situacao}</td>
            <td>${u.statusFinanceiro}</td>
            <td>${u.habitavel}</td>
            <td>${u.cvco}</td>
            <td>${u.chaves}</td>
            <td>${u.dataVistoria || ""}</td>
            <td>${u.dataLiberacao || ""}</td>
            <td><button class="btn-small btn-editar" onclick="editar(${u.id})">Editar</button></td>
        `;

        tbody.appendChild(tr);
    });
}

// SALVAR UNIDADE
get("formUnidade").addEventListener("submit", async(e)=>{
    e.preventDefault();

    const dados = {
        bloco_id: blocoId,
        unidade: get("nUnidade").value,
        situacao: get("selSituacao").value,
        statusFinanceiro: get("selFinanceiro").value,
        habitavel: get("selHabitavel").value,
        cvco: get("selCVCO").value,
        chaves: get("selChaves").value,
        dataVistoria: get("dtVistoria").value,
        horaVistoria: get("hrVistoria").value,
        dataLiberacao: get("dtLiberacao").value,
        agendadoPor: get("agendadoPor").value,
        observacao: get("obsUnidade").value
    };

    const id = get("idUnidade").value;

    if(id === ""){
        await fetch("/unidades",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify(dados)
        });
        alert("Unidade criada!");
    }else{
        await fetch(`/unidades/${id}`,{
            method:"PUT",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify(dados)
        });
        alert("Unidade atualizada!");
    }

    cancelarEdicao();
    preencherTabela();
});

// EDITAR
async function editar(id){
    const res = await fetch(`/unidade/${id}`);
    const u = await res.json();

    get("idUnidade").value = u.id;
    get("nUnidade").value = u.unidade;
    get("selSituacao").value = u.situacao;
    get("selFinanceiro").value = u.statusFinanceiro;
    get("selHabitavel").value = u.habitavel;
    get("selCVCO").value = u.cvco;
    get("selChaves").value = u.chaves;

    get("dtVistoria").value = u.dataVistoria || "";
    get("hrVistoria").value = u.horaVistoria || "";
    get("dtLiberacao").value = u.dataLiberacao || "";
    get("agendadoPor").value = u.agendadoPor || "";
    get("obsUnidade").value = u.observacao || "";

    get("formTitulo").innerText = "Editar Unidade";
    get("btnSalvar").innerText = "Atualizar";
    get("btnCancelar").style.display = "inline-block";
}

// CANCELAR
function cancelarEdicao(){
    get("idUnidade").value = "";
    get("nUnidade").value = "";
    get("selSituacao").value = "";
    get("selFinanceiro").value = "";
    get("selHabitavel").value = "";
    get("selCVCO").value = "";
    get("selChaves").value = "";
    get("dtVistoria").value = "";
    get("hrVistoria").value = "";
    get("dtLiberacao").value = "";
    get("agendadoPor").value = "";
    get("obsUnidade").value = "";

    get("formTitulo").innerText = "Nova Unidade";
    get("btnSalvar").innerText = "Salvar";
    get("btnCancelar").style.display = "none";
}

// INICIAR
carregarCabecalho();
preencherTabela();
</script>

</body>
</html>
