<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Unidades – ChaveVR</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/chavesvr.js"></script>
</head>

<body>

    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
    </div>

    <div class="container">
        <h1>Cadastro de Unidades</h1>

        <p id="contexto" style="font-weight:bold; margin-bottom:20px;"></p>

        <form id="formUnidade" onsubmit="salvarUnidade(event)">
            <input type="hidden" id="id" />
            
            <input type="hidden" id="bloco_id" />

            <label>Unidade (Número/Nome)</label>
            <input id="unidade" required placeholder="Ex: 101, 12B, Casa 05..." />

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Situação da Obra</label>
                    <select id="situacao">
                        <option value="Em obra">Em obra</option>
                        <option value="Ajuste de cliente">Ajuste de cliente</option>
                        <option value="Aprovada">Aprovada (Vistoria)</option>
                        <option value="Liberada">Liberada (Pronta)</option>
                    </select>
                </div>
                <div>
                    <label>Status Financeiro</label>
                    <select id="statusFinanceiro">
                        <option value="Liberada">Liberada</option>
                        <option value="Bloqueada">Bloqueada</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Condição Habitável?</label>
                    <select id="habitavel">
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>
                <div>
                    <label>CVCO / Habite-se</label>
                    <select id="cvco">
                        <option value="Liberado">Liberado</option>
                        <option value="Não liberado">Não liberado</option>
                    </select>
                </div>
            </div>

            <label>Entrega de Chaves</label>
            <select id="chaves">
                <option value="Não entregue">Não entregue</option>
                <option value="Entregue">Entregue</option>
            </select>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                <div>
                    <label>Data Vistoria</label>
                    <input type="date" id="dataVistoria" />
                </div>
                <div>
                    <label>Hora Vistoria</label>
                    <input type="time" id="horaVistoria" />
                </div>
            </div>

            <label>Data Liberação</label>
            <input type="date" id="dataLiberacao" />

            <label>Agendado Por</label>
            <input id="agendadoPor" />

            <label>Observação</label>
            <textarea id="observacao"></textarea>

            <button class="btn-primary" style="margin-top:20px;">Salvar Unidade</button>
        </form>

        <hr style="margin:30px 0">

        <h2>Unidades do Bloco</h2>

        <table style="font-size: 0.9em;">
            <thead>
                <tr>
                    <th>Unid.</th>
                    <th>Situação</th>
                    <th>Financ.</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaUnidades"></tbody>
        </table>
    </div>

<script>
// --- VARIÁVEIS GLOBAIS (CRUCIAL: Devem estar aqui fora) ---
let empId = null;
let blocoId = null;

/****************************************************
 * INICIAR TELA
 ****************************************************/
document.addEventListener("DOMContentLoaded", async () => {

    // 1. Ler IDs da URL
    const params = new URLSearchParams(location.search);
    
    // Atribui às variáveis globais (sem usar 'let' ou 'const' aqui)
    empId   = params.get("emp");
    blocoId = params.get("bloco");

    // Validação de segurança
    if (!empId || !blocoId) {
        alert("Empreendimento ou bloco não informado!");
        location.href = "/cadastro_empreendimentos.html";
        return;
    }

    // Define o ID do bloco no input hidden apenas visualmente
    if(get("bloco_id")) get("bloco_id").value = blocoId;

    // 2. Carregar contexto e lista
    await carregarContexto();
    await listarUnidades();
});

/****************************************************
 * MOSTRAR ONDE ESTAMOS
 ****************************************************/
async function carregarContexto() {
    try {
        // Busca nome do Empreendimento
        const resEmp = await fetch("/empreendimentos");
        const listaEmp = await resEmp.json();
        const emp = listaEmp.find(e => e.id == empId);

        // Busca nome do Bloco
        const resBl = await fetch(`/blocos/${empId}`);
        const listaBl = await resBl.json();
        const bloco = listaBl.find(b => b.id == blocoId);

        if (emp && bloco) {
            get("contexto").innerHTML = `
                <span style="color:#666;">${emp.nome}</span> &raquo; 
                <span style="color:#000;">${bloco.nome}</span>
            `;
        }
    } catch (error) {
        console.error("Erro ao carregar contexto:", error);
    }
}

/****************************************************
 * LISTAR UNIDADES
 ****************************************************/
async function listarUnidades() {
    try {
        const res = await fetch(`/unidades/${blocoId}`);
        const lista = await res.json();

        const tbody = get("tabelaUnidades");
        tbody.innerHTML = "";

        lista.forEach(u => {
            const tr = document.createElement("tr");

            // Formatação simples para datas
            const dataVist = u.dataVistoria ? new Date(u.dataVistoria).toLocaleDateString('pt-BR', {timeZone:'UTC'}) : '-';

            tr.innerHTML = `
                <td><strong>${u.unidade}</strong></td>
                <td>${u.situacao}</td>
                <td>${u.statusFinanceiro}</td>
                <td>${u.cvco}</td>
                <td>${u.chaves}</td>
                <td>${dataVist} ${u.horaVistoria || ""}</td>
                <td>
                    <button class="btn-small btn-editar" onclick='editar(${JSON.stringify(u)})'>
                        Editar
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    } catch (error) {
        console.error("Erro ao listar unidades:", error);
    }
}

/****************************************************
 * EDITAR
 ****************************************************/
function editar(u) {
    get("id").value = u.id;
    get("unidade").value = u.unidade;
    get("situacao").value = u.situacao;
    get("statusFinanceiro").value = u.statusFinanceiro;
    get("habitavel").value = u.habitavel;
    get("cvco").value = u.cvco;
    get("chaves").value = u.chaves;
    get("dataVistoria").value = u.dataVistoria || "";
    get("horaVistoria").value = u.horaVistoria || "";
    get("dataLiberacao").value = u.dataLiberacao || "";
    get("agendadoPor").value = u.agendadoPor || "";
    get("observacao").value = u.observacao || "";
    
    // Rola a tela para o formulário
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/****************************************************
 * SALVAR (POST/PUT) - CORRIGIDO
 ****************************************************/
async function salvarUnidade(e) {
    e.preventDefault();

    // Verificação extra de segurança
    if (!blocoId) {
        alert("Erro crítico: ID do Bloco perdido. Atualize a página.");
        return;
    }

    const id = get("id").value;

    const dados = {
        bloco_id: blocoId, // <--- USO DA VARIÁVEL GLOBAL (Correção do erro)
        unidade: get("unidade").value,
        situacao: get("situacao").value,
        statusFinanceiro: get("statusFinanceiro").value,
        habitavel: get("habitavel").value,
        cvco: get("cvco").value,
        chaves: get("chaves").value,
        dataVistoria: get("dataVistoria").value,
        horaVistoria: get("horaVistoria").value,
        dataLiberacao: get("dataLiberacao").value,
        agendadoPor: get("agendadoPor").value,
        observacao: get("observacao").value
    };

    console.log("Enviando:", dados); // Para debug

    const metodo = id ? "PUT" : "POST";
    const url = id ? `/unidades/${id}` : "/unidades";

    try {
        const res = await fetch(url, {
            method: metodo,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados)
        });

        if (!res.ok) throw new Error("Falha ao salvar");

        alert("Salvo com sucesso!");
        
        // Limpa o formulário
        get("formUnidade").reset();
        get("id").value = "";
        
        // Garante que o input hidden tenha o valor de volta (caso precise)
        if(get("bloco_id")) get("bloco_id").value = blocoId; 

        // Atualiza a tabela imediatamente
        listarUnidades();

    } catch (error) {
        alert("Erro ao salvar. Verifique o console.");
        console.error(error);
    }
}
</script>

</body>
</html>
