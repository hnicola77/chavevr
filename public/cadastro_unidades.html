<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Unidades</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        tr.verde { background:#d4ffd4 !important; }
        tr.amarelo { background:#fff6b0 !important; }
        tr.vermelho { background:#ffc4c4 !important; }
    </style>
</head>

<body>

<!-- MENU SUPERIOR -->
<div class="top-menu">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
    <a href="/cadastro_blocos.html">Blocos</a>
    <a href="/index.html">Módulos</a>
</div>

<div class="container">

    <h1>Cadastro de Unidades</h1>

    <!-- INFORMAÇÃO DO EMP E BLOCO -->
    <div style="background:#eef2f7; padding:15px; margin-bottom:20px; border-radius:8px;">
        <h3 id="infoEmp"></h3>
        <h4 id="infoBloco" style="margin-top:5px;"></h4>
    </div>

    <h2 id="formTitulo">Nova Unidade</h2>

    <form id="formUnidade">
        <input type="hidden" id="idUnidade">

        <label>Unidade</label>
        <input type="text" id="nUnidade" required>

        <div class="row">
            <div>
                <label>Situação</label>
                <select id="selSituacao">
                    <option value="Em obra">Em obra</option>
                    <option value="Ajuste de cliente">Ajuste de cliente</option>
                    <option value="Liberada">Liberada</option>
                    <option value="Aprovada">Aprovada</option>
                </select>
            </div>

            <div>
                <label>Status Financeiro</label>
                <select id="selFinanceiro">
                    <option value="Liberada">Liberada</option>
                    <option value="Bloqueada">Bloqueada</option>
                </select>
            </div>

            <div>
                <label>Habitável</label>
                <select id="selHabitavel">
                    <option value="Sim">Sim</option>
                    <option value="Não">Não</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div>
                <label>CVCO</label>
                <select id="selCVCO">
                    <option value="Liberado">Liberado</option>
                    <option value="Pendente">Pendente</option>
                </select>
            </div>

            <div>
                <label>Chaves</label>
                <select id="selChaves">
                    <option value="Entregue">Entregue</option>
                    <option value="Não entregue">Não entregue</option>
                </select>
            </div>

            <div>
                <label>Agendado Por</label>
                <input type="text" id="agendadoPor">
            </div>
        </div>

        <div class="row">
            <div>
                <label>Data Vistoria</label>
                <input type="date" id="dtVistoria">
            </div>
            <div>
                <label>Hora Vistoria</label>
                <input type="time" id="hrVistoria">
            </div>
            <div>
                <label>Data Liberação</label>
                <input type="date" id="dtLiberacao">
            </div>
        </div>

        <label>Observações</label>
        <textarea id="obsUnidade"></textarea>

        <br>
        <button class="btn-primary" type="submit" id="btnSalvar">Salvar</button>
        <button class="btn-secondary" type="button" id="btnCancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar</button>
    </form>

    <hr style="margin:40px 0;">

    <h2>Unidades Cadastradas</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Unidade</th>
                <th>Situação</th>
                <th>Financeiro</th>
                <th>Habitável</th>
                <th>CVCO</th>
                <th>Chaves</th>
                <th>Vistoria</th>
                <th>Liberação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaUnidades"></tbody>
    </table>

</div>

<script>
/**************************************
 * HELPERS
 **************************************/
function get(id) { return document.getElementById(id); }

/**************************************
 * PARAMETROS DA URL
 **************************************/
const url = new URLSearchParams(window.location.search);
const empId = url.get("emp");
const blocoId = url.get("bloco");

let nomeEmp = "";
let nomeBloco = "";

/**************************************
 * CARREGAR EMPREENDIMENTO E BLOCO
 **************************************/
async function carregarInfoTopo() {
    const empRes = await fetch("/empreendimentos");
    const empreendimentos = await empRes.json();
    const emp = empreendimentos.find(e => e.id == empId);

    if (emp) {
        nomeEmp = emp.nome;
        get("infoEmp").innerText = "Empreendimento: " + emp.nome;
    }

    const blocoRes = await fetch(`/blocos/${empId}`);
    const blocos = await blocoRes.json();
    const bloco = blocos.find(b => b.id == blocoId);

    if (bloco) {
        nomeBloco = bloco.nome;
        get("infoBloco").innerText = "Bloco: " + bloco.nome;
    }
}

/**************************************
 * CARREGAR UNIDADES
 **************************************/
async function carregarUnidades() {
    const res = await fetch(`/unidades/${blocoId}`);
    const lista = await res.json();

    const tbody = get("tabelaUnidades");
    tbody.innerHTML = "";

    lista.forEach(u => {
        const tr = document.createElement("tr");

        let cor = "";
        if (u.chaves === "Entregue") cor = "verde";
        else if (["Liberada", "Aprovada"].includes(u.situacao) && u.chaves === "Não entregue") cor = "amarelo";
        else if (["Em obra", "Ajuste de cliente"].includes(u.situacao)) cor = "vermelho";

        tr.classList.add(cor);

        tr.innerHTML = `
            <td>${u.id}</td>
            <td>${u.unidade}</td>
            <td>${u.situacao}</td>
            <td>${u.statusFinanceiro}</td>
            <td>${u.habitavel}</td>
            <td>${u.cvco}</td>
            <td>${u.chaves}</td>
            <td>${u.dataVistoria || ""}</td>
            <td>${u.dataLiberacao || ""}</td>
            <td><button class="btn-small btn-editar" onclick="editar(${u.id})">Editar</button></td>
        `;
        tbody.appendChild(tr);
    });
}

/**************************************
 * SALVAR UNIDADE
 **************************************/
get("formUnidade").addEventListener("submit", async (e) => {
    e.preventDefault();

    const u = {
        bloco_id: blocoId,
        unidade: get("nUnidade").value,
        situacao: get("selSituacao").value,
        statusFinanceiro: get("selFinanceiro").value,
        habitavel: get("selHabitavel").value,
        cvco: get("selCVCO").value,
        chaves: get("selChaves").value,
        dataVistoria: get("dtVistoria").value,
        horaVistoria: get("hrVistoria").value,
        dataLiberacao: get("dtLiberacao").value,
        agendadoPor: get("agendadoPor").value,
        observacao: get("obsUnidade").value
    };

    const id = get("idUnidade").value;

    if (id === "") {
        await fetch("/unidades", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(u)
        });
        alert("Unidade cadastrada!");
    } else {
        await fetch(`/unidades/${id}`, {
            method:"PUT",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(u)
        });
        alert("Unidade atualizada!");
    }

    cancelarEdicao();
    carregarUnidades();
});

/**************************************
 * EDITAR UNIDADE
 **************************************/
async function editar(id) {
    const res = await fetch(`/unidades/${blocoId}`);
    const lista = await res.json();
    const u = lista.find(x => x.id == id);

    get("idUnidade").value = u.id;
    get("nUnidade").value = u.unidade;
    get("selSituacao").value = u.situacao;
    get("selFinanceiro").value = u.statusFinanceiro;
    get("selHabitavel").value = u.habitavel;
    get("selCVCO").value = u.cvco;
    get("selChaves").value = u.chaves;
    get("dtVistoria").value = u.dataVistoria || "";
    get("hrVistoria").value = u.horaVistoria || "";
    get("dtLiberacao").value = u.dataLiberacao || "";
    get("agendadoPor").value = u.agendadoPor || "";
    get("obsUnidade").value = u.observacao || "";

    get("formTitulo").innerText = "Editar Unidade";
    get("btnSalvar").innerText = "Atualizar";
    get("btnCancelar").style.display = "inline-block";
}

/**************************************
 * CANCELAR EDIÇÃO
 **************************************/
function cancelarEdicao() {
    get("idUnidade").value = "";
    get("formTitulo").innerText = "Nova Unidade";
    get("btnSalvar").innerText = "Salvar";
    get("btnCancelar").style.display = "none";

    get("nUnidade").value = "";
    get("obsUnidade").value = "";
}

/**************************************
 * INICIAR
 **************************************/
(async () => {
    await carregarInfoTopo();
    await carregarUnidades();
})();
</script>

</body>
</html>
