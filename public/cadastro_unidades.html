<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Cadastro de Unidades</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background: #f4f6f9;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .top-menu {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            padding: 15px 30px;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }
        .top-menu a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }
        h1, h2 {
            margin-top: 0;
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #444;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row > div {
            flex: 1;
        }
        .btn-primary {
            background: #007bff;
            padding: 10px 18px;
            border-radius: 6px;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 13px;
        }
        th {
            background: #f7f7f7;
            font-weight: bold;
        }

        /* Cores da tabela (ligadas ao JS) */
        tr.verde { background: #d6ffd6 !important; }
        tr.amarelo { background: #fff4cc !important; }
        tr.vermelho { background: #ffd6d6 !important; }

        .btn-small {
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-editar {
            background: #28a745;
            color: white;
        }
    </style>
</head>

<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/chavevr/dashboard.html">Dashboard</a>
        <a href="/chavevr/cadastro_blocos.html">Blocos</a>
        <a href="/chavevr/cadastro_empreendimentos.html">Empreendimentos</a>
        <a href="/index.html">Módulos</a>
    </div>

    <div class="container">

        <h1>Cadastro de Unidades</h1>
        <p>Selecione o bloco e cadastre as unidades abaixo.</p>

        <!-- FORMULÁRIO -->
        <h2>Nova Unidade</h2>

        <form id="formUnidade">

            <label>Bloco</label>
            <select id="selBloco" required>
                <option value="">Selecione...</option>
            </select>

            <label>Número da Unidade</label>
            <input type="text" id="nUnidade" required>

            <div class="row">
                <div>
                    <label>Situação</label>
                    <select id="selSituacao" required>
                        <option value="Em obra">Em obra</option>
                        <option value="Ajuste de cliente">Ajuste de cliente</option>
                        <option value="Liberada">Liberada</option>
                        <option value="Aprovada">Aprovada</option>
                    </select>
                </div>

                <div>
                    <label>Status Financeiro</label>
                    <select id="selFinanceiro" required>
                        <option value="Liberada">Liberada</option>
                        <option value="Bloqueada">Bloqueada</option>
                    </select>
                </div>

                <div>
                    <label>Habitável</label>
                    <select id="selHabitavel" required>
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>CVCO</label>
                    <select id="selCVCO">
                        <option value="Liberado">Liberado</option>
                        <option value="Pendente">Pendente</option>
                    </select>
                </div>

                <div>
                    <label>Chaves</label>
                    <select id="selChaves">
                        <option value="Entregue">Entregue</option>
                        <option value="Não entregue">Não entregue</option>
                    </select>
                </div>

                <div>
                    <label>Agendado Por</label>
                    <input type="text" id="agendadoPor">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Data da Vistoria</label>
                    <input type="date" id="dtVistoria">
                </div>

                <div>
                    <label>Hora da Vistoria</label>
                    <input type="time" id="hrVistoria">
                </div>

                <div>
                    <label>Data de Liberação</label>
                    <input type="date" id="dtLiberacao">
                </div>
            </div>

            <label>Observações</label>
            <textarea id="obsUnidade"></textarea>

            <br>
            <button class="btn-primary" type="submit">Salvar Unidade</button>
        </form>

        <!-- LISTAGEM -->
        <h2 style="margin-top:40px;">Unidades Cadastradas</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                </tr>
            </thead>
            <tbody id="tabelaUnidades">
                <!-- Preenchido via JS -->
            </tbody>
        </table>

    </div>

    <script src="/chavesvr.js"></script>

</body>
</html>
