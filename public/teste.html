<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TESTE - ChaveVR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .btn {
            padding: 15px 30px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover {
            background: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 5px;
            border: 2px solid #007bff;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🔧 TESTE DO CHAVEVR</h1>
    <p>Este arquivo testa se o JavaScript está funcionando.</p>

    <button class="btn" onclick="testarBotao()">
        🧪 CLIQUE AQUI PARA TESTAR
    </button>

    <button class="btn" onclick="testarAPI()">
        📡 TESTAR CONEXÃO COM API
    </button>

    <div id="resultado"></div>

    <script>
        console.log("✅ JavaScript está funcionando!");

        function testarBotao() {
            console.log("✅ Função testarBotao() foi chamada!");
            
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = `
                <p class="success">✅ SUCESSO!</p>
                <p>O JavaScript está funcionando perfeitamente!</p>
                <p>Hora do teste: ${new Date().toLocaleTimeString()}</p>
            `;
            
            alert("✅ JavaScript está funcionando! O botão respondeu.");
        }

        async function testarAPI() {
            console.log("📡 Testando conexão com API...");
            
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = `<p>⏳ Testando conexão com o servidor...</p>`;

            try {
                const res = await fetch("/unidades");
                console.log("Status da resposta:", res.status);
                
                if (res.ok) {
                    const unidades = await res.json();
                    console.log("Unidades recebidas:", unidades.length);
                    
                    resultado.innerHTML = `
                        <p class="success">✅ CONEXÃO OK!</p>
                        <p>Servidor respondeu com sucesso</p>
                        <p>Total de unidades no banco: ${unidades.length}</p>
                    `;
                } else {
                    resultado.innerHTML = `
                        <p class="error">❌ ERRO ${res.status}</p>
                        <p>O servidor respondeu, mas com erro</p>
                    `;
                }
            } catch (error) {
                console.error("Erro na conexão:", error);
                resultado.innerHTML = `
                    <p class="error">❌ ERRO DE CONEXÃO</p>
                    <p>Não foi possível conectar ao servidor</p>
                    <p>Erro: ${error.message}</p>
                `;
            }
        }

        // Testa automaticamente quando a página carrega
        document.addEventListener("DOMContentLoaded", () => {
            console.log("✅ DOM carregado!");
            console.log("✅ Funções disponíveis:");
            console.log("   - testarBotao()");
            console.log("   - testarAPI()");
        });
    </script>

</body>
</html>
