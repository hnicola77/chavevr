<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Unidades</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background:#f5f6fa; margin:0; font-family:Arial,sans-serif; }
        .top-menu {
            display:flex; justify-content:flex-end; gap:15px;
            padding:15px 30px; background:#fff; border-bottom:1px solid #ddd;
        }
        .top-menu a { text-decoration:none; color:#333; font-weight:bold; }
        .container {
            max-width:1100px; margin:30px auto; background:#fff;
            padding:30px; border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,0.12);
        }
        h1,h2 { margin-top:0; color:#2c3e50; }
        label {
            display:block; margin-top:10px; font-weight:bold; color:#34495e;
        }
        select, input, textarea {
            width:100%; padding:8px 10px; margin-top:4px;
            border-radius:6px; border:1px solid #ccc; font-size:14px;
        }
        textarea { height:80px; resize:vertical; }
        .row { display:flex; gap:15px; }
        .row > div { flex:1; }
        .info-emp {
            background:#f0f4ff; border-radius:8px; padding:12px;
            border:1px solid #d0defc; font-size:14px; margin-top:12px;
        }
        .actions { margin-top:20px; display:flex; gap:10px; }
        .btn-primary {
            background:#4070f4; padding:10px 22px; color:#fff;
            border-radius:6px; border:none; cursor:pointer; font-weight:bold;
        }
        .btn-secondary {
            background:#888; padding:10px 22px; color:#fff;
            border-radius:6px; border:none; cursor:pointer; font-weight:bold;
        }
        table {
            width:100%; border-collapse:collapse; background:white;
            border-radius:10px; overflow:hidden; margin-top:15px;
        }
        th,td {
            padding:8px 10px; border-bottom:1px solid #eee;
            text-align:left; font-size:13px;
        }
        th { background:#fafafa; font-weight:bold; }
        .btn-small {
            padding:4px 8px; border-radius:4px; border:none;
            cursor:pointer; font-size:12px;
        }
        .btn-editar { background:#f1c40f; color:#000; }
    </style>
</head>
<body>

    <div class="top-menu">
        <a href="/empreendimentos.html">Empreendimentos</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/index.html">Módulos</a>
    </div>

    <div class="container">
        <h1>Unidades por empreendimento</h1>

        <!-- Seleção do empreendimento -->
        <section>
            <h2>1. Selecione o empreendimento</h2>
            <select id="selectEmpreendimento">
                <option value="">Selecione...</option>
            </select>
            <div id="infoEmpreendimento" class="info-emp" style="display:none;"></div>
        </section>

        <hr style="margin:25px 0;">

        <!-- Formulário de unidade -->
        <section>
            <h2>2. Cadastro / edição de unidade</h2>

            <form id="form-unidade">
                <div class="row">
                    <div>
                        <label for="bloco">Bloco</label>
                        <input id="bloco" type="text">
                    </div>
                    <div>
                        <label for="pavimento">Pavimento</label>
                        <input id="pavimento" type="text">
                    </div>
                    <div>
                        <label for="unidade">Unidade</label>
                        <input id="unidade" type="text" required>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label for="situacao">Situação</label>
                        <select id="situacao">
                            <option>Pendente</option>
                            <option>Liberada</option>
                            <option>Reprovada</option>
                        </select>
                    </div>
                    <div>
                        <label for="statusFinanceiro">Status financeiro</label>
                        <select id="statusFinanceiro">
                            <option>OK</option>
                            <option>Pendente</option>
                        </select>
                    </div>
                    <div>
                        <label for="habiteSe">Habite-se</label>
                        <select id="habiteSe">
                            <option>Sim</option>
                            <option>Não</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label for="cvco">CVCO</label>
                        <select id="cvco">
                            <option>Liberado</option>
                            <option>Pendente</option>
                        </select>
                    </div>
                    <div>
                        <label for="chaves">Chaves</label>
                        <select id="chaves">
                            <option>Entregue</option>
                            <option>Não entregue</option>
                        </select>
                    </div>
                    <div>
                        <label for="agendadoPor">Agendado por</label>
                        <input id="agendadoPor" type="text">
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label for="dataVistoria">Data vistoria</label>
                        <input id="dataVistoria" type="date">
                    </div>
                    <div>
                        <label for="horaVistoria">Hora vistoria</label>
                        <input id="horaVistoria" type="time">
                    </div>
                    <div>
                        <label for="dataLiberacao">Data liberação</label>
                        <input id="dataLiberacao" type="date">
                    </div>
                </div>

                <label for="observacao">Observação</label>
                <textarea id="observacao"></textarea>

                <div class="actions">
                    <button type="submit" class="btn-primary" id="btnSalvarUnidade">Salvar unidade</button>
                    <button type="button" class="btn-secondary" id="btnNovaUnidade">Nova unidade</button>
                </div>
            </form>
        </section>

        <hr style="margin:25px 0;">

        <!-- Lista de unidades -->
        <section>
            <h2>3. Unidades cadastradas neste empreendimento</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Unidade</th>
                        <th>Bloco</th>
                        <th>Pav.</th>
                        <th>Situação</th>
                        <th>Status fin.</th>
                        <th>Habite-se</th>
                        <th>CVCO</th>
                        <th>Chaves</th>
                        <th>Data vistoria</th>
                        <th>Data liberação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-unidades-empreendimento">
                    <!-- preenchido via chavesvr.js -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="/chavesvr.js"></script>
</body>
</html>
