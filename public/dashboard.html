<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ChaveVR</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
    <h1>Dashboard</h1>
    <nav>
        <a href="/index.html">Início</a>
        <a href="/dashboard.html" class="active">Dashboard</a>
        <a href="/cadastro.html">Cadastrar</a>
    </nav>
</header>

<main class="container">

    <h2>Resumo das Unidades</h2>

    <div class="cards">
        <div class="card">
            <h3>Total</h3>
            <p id="totalUnidades">0</p>
        </div>

        <div class="card">
            <h3>Pendentes</h3>
            <p id="pendentes">0</p>
        </div>

        <div class="card">
            <h3>Liberadas</h3>
            <p id="liberadas">0</p>
        </div>

        <div class="card">
            <h3>Bloqueadas</h3>
            <p id="bloqueadas">0</p>
        </div>
    </div>

    <section>
        <h2>Lista Completa</h2>
        <table id="tableUnidades">
            <thead>
                <tr>
                    <th>Unidade</th>
                    <th>Empreendimento</th>
                    <th>Status</th>
                    <th>Observação</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

</main>

<script src="/chavesvr.js"></script>

</body>
</html>
