<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>ChaveVR – Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/chavesvr.js"></script>
</head>

<body>

    <!-- MENU -->
    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
        <a href="/cadastro_blocos.html">Blocos</a>
        <a href="/cadastro_unidades.html">Unidades</a>
    </div>

    <div class="container">

        <h1>Dashboard – ChaveVR</h1>
        <p>Visão geral das entregas de chaves.</p>

        <!-- FILTROS -->
        <div class="filtros">
            <select id="filtroEmpreendimento">
                <option value="">Empreendimento</option>
            </select>

            <select id="filtroBloco">
                <option value="">Bloco</option>
            </select>

            <button class="btn-secondary" onclick="aplicarFiltros()">Buscar</button>
            <button class="btn-secondary" onclick="limparFiltros()">Limpar</button>
        </div>

        <!-- CARDS -->
        <div class="cards">
            <div class="card" onclick="filtrarCard('total')">
                <h3>Total</h3>
                <p id="cardTotal">0</p>
            </div>

            <div class="card" onclick="filtrarCard('pendentes')">
                <h3>Pendentes</h3>
                <p id="cardPendentes">0</p>
            </div>

            <div class="card" onclick="filtrarCard('liberadas')">
                <h3>Liberadas</h3>
                <p id="cardLiberadas">0</p>
            </div>

            <div class="card" onclick="filtrarCard('reprovadas')">
                <h3>Aprovadas</h3>
                <p id="cardReprovadas">0</p>
            </div>

            <div class="card" onclick="filtrarCard('entregues')">
                <h3>Chaves Entregues</h3>
                <p id="cardChaves">0</p>
            </div>

            <div class="card" onclick="filtrarCard('cvco')">
                <h3>CVCO</h3>
                <p id="cardCVCO">0</p>
            </div>
        </div>

        <!-- TABELA -->
        <table>
            <thead>
                <tr>
                    <th>Empreendimento</th>
                    <th>Bloco</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                </tr>
            </thead>

            <tbody id="tabelaDash"></tbody>
        </table>

    </div>

<script>
let listaCompleta = [];

// =====================
// INICIAR DASHBOARD
// =====================
document.addEventListener("DOMContentLoaded", async () => {

    await ChaveVR.carregarEmpreendimentosSelect("filtroEmpreendimento");

    listaCompleta = await ChaveVR.carregarDashboardCompleto();

    ChaveVR.atualizarCardsDash(listaCompleta);
    ChaveVR.preencherTabelaDash(listaCompleta);

    // Quando muda o empreendimento → carrega blocos
    get("filtroEmpreendimento").addEventListener("change", async (e) => {
        await ChaveVR.carregarBlocosSelect("filtroBloco", e.target.value);
    });
});

// =====================
// FILTRAR
// =====================
async function aplicarFiltros() {
    let lista = [...listaCompleta];

    const empId = get("filtroEmpreendimento").value;
    const blocoId = get("filtroBloco").value;

    if (empId) {
        lista = lista.filter(u => u.emp_id == empId);
    }

    if (blocoId) {
        lista = lista.filter(u => u.bloco_id == blocoId);
    }

    ChaveVR.atualizarCardsDash(lista);
    ChaveVR.preencherTabelaDash(lista);
}

function limparFiltros() {
    get("filtroEmpreendimento").value = "";
    get("filtroBloco").innerHTML = `<option value="">Bloco</option>`;

    ChaveVR.atualizarCardsDash(listaCompleta);
    ChaveVR.preencherTabelaDash(listaCompleta);
}

// =====================
// FILTRAR POR CARD
// =====================
function filtrarCard(tipo) {
    const lista = ChaveVR.filtrarPorCard(listaCompleta, tipo);
    ChaveVR.atualizarCardsDash(lista);
    ChaveVR.preencherTabelaDash(lista);
}

</script>

</body>
</html>
