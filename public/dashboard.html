<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard – ChaveVR</title>
    
    <link rel="stylesheet" href="/styles.css"> 
    
    <!-- Este script contém a lógica do dashboard, incluindo a nova funcionalidade de filtro por card -->
    <script src="/dashboard.js" defer></script>
</head>

<body>

    <div class="top-menu">
        <!-- Ajuste dos links para o novo portal/estrutura -->
        <a href="/">Módulos</a>
        <a href="/chavevr/cadastro_unidades.html">Cadastro de Unidades</a>
        <a class="ativo" href="/chavevr/dashboard.html">Dashboard</a>
    </div>

    <div class="container">

        <h1>Dashboard - ChaveVR</h1>

        <div class="cards">
            <!-- Adicionando a classe 'card-clickable' e a função 'filtrarPorCard' para filtro automático -->
            <div id="cardTotal" class="card card-clickable" style="background-color:#ffe0b2;" onclick="filtrarPorCard('total')">
                <h2>Total Unidades</h2>
                <p>0</p>
            </div>
            <div id="cardEntregues" class="card card-clickable" style="background-color:#ff7070; color:white;" onclick="filtrarPorCard('entregues')">
                <h2>Chaves Entregues</h2>
                <p>0</p>
            </div>
            <div id="cardPendentes" class="card card-clickable" style="background-color:#9fa8da;" onclick="filtrarPorCard('pendentes')">
                <h2>Unidades Pendentes</h2>
                <p>0</p>
            </div>
            <div id="cardLiberadas" class="card card-clickable" style="background-color:#81c784;" onclick="filtrarPorCard('liberadas')">
                <h2>Liberadas (Obra)</h2>
                <p>0</p>
            </div>
            <div id="cardAprovadas" class="card card-clickable" style="background-color:#4db6ac;" onclick="filtrarPorCard('aprovadas')">
                <h2>Vistorias Aprovadas</h2>
                <p>0</p>
            </div>
            </div>

        <div class="filtros">
            <!-- Manter onchange para filtro imediato -->
            <select id="fEmpreendimento" onchange="aplicarFiltro()">
                </select>
            
            <select id="fBloco" onchange="aplicarFiltro()">
                </select>

            <select id="fSituacao" onchange="aplicarFiltro()">
                <option value="">Situação</option> 
                <option value="Em obra">Em obra</option>
                <option value="Ajuste de cliente">Ajuste de cliente</option>
                <option value="Liberada">Liberada</option>
                <option value="Aprovada">Aprovada</option>
                <option value="Cancelada">Cancelada</option>
            </select>
            
            <!-- Botões para limpar os filtros -->
            <button class="btn-secondary" onclick="limparFiltroCards()">Limpar Filtro Card</button>
            <button class="btn-primary" onclick="limparFiltrosGerais()">Limpar Filtros Gerais</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Empreendimento</th>
                    <th>Bloco</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                </tr>
            </thead>
            <tbody id="tabelaDash">
                </tbody>
        </table>

    </div>

</body>
</html>
