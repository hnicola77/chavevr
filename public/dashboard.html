<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>ChaveVR – Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/chavesvr.js"></script>
</head>

<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
        <a href="/cadastro_blocos.html">Blocos</a>
        <a href="/cadastro_unidades.html">Unidades</a>
    </div>

    <div class="container">

        <h1>Dashboard – ChaveVR</h1>
        <p>Visão geral das unidades por empreendimento e bloco.</p>

        <!-- FILTROS -->
        <div class="filtros">
            <select id="filtroEmpreendimento">
                <option value="">Selecione o Empreendimento</option>
            </select>

            <select id="filtroBloco">
                <option value="">Selecione o Bloco</option>
            </select>

            <button class="btn-secondary" onclick="aplicarFiltros()">Aplicar Filtros</button>
            <button class="btn-secondary" onclick="limparFiltros()">Limpar</button>
        </div>

        <!-- CARDS -->
        <div class="cards">
            <div class="card" onclick="cardFiltro('total')">
                <h3>Total</h3>
                <p id="cardTotal">0</p>
            </div>

            <div class="card" onclick="cardFiltro('pendentes')">
                <h3>Pendentes</h3>
                <p id="cardPendentes">0</p>
            </div>

            <div class="card" onclick="cardFiltro('liberadas')">
                <h3>Liberadas</h3>
                <p id="cardLiberadas">0</p>
            </div>

            <div class="card" onclick="cardFiltro('reprovadas')">
                <h3>Aprovadas</h3>
                <p id="cardReprovadas">0</p>
            </div>

            <div class="card" onclick="cardFiltro('entregues')">
                <h3>Chaves Entregues</h3>
                <p id="cardChaves">0</p>
            </div>

            <div class="card" onclick="cardFiltro('cvco')">
                <h3>CVCO Liberado</h3>
                <p id="cardCVCO">0</p>
            </div>
        </div>

        <!-- TABELA -->
        <table>
            <thead>
                <tr>
                    <th>Empreendimento</th>
                    <th>Bloco</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                </tr>
            </thead>
            <tbody id="tabelaDash"></tbody>
        </table>

    </div>

<script>
let listaCompleta = [];

/***********************
 * CARREGAR DASHBOARD
************************/
document.addEventListener("DOMContentLoaded", async () => {

    // carregar empreendimentos no filtro
    await ChaveVR.carregarEmpreendimentosSelect("filtroEmpreendimento");

    // carregar toda a base de dados
    listaCompleta = await ChaveVR.carregarDashboardCompleto();

    // atualizar cards
    ChaveVR.atualizarCardsDash(listaCompleta);

    // preencher tabela
    ChaveVR.preencherTabelaDash(listaCompleta);
});

/***********************
 * FILTROS
***********************/
async function aplicarFiltros() {

    const empId = get("filtroEmpreendimento").value;
    const blocoId = get("filtroBloco").value;

    let filtrado = listaCompleta;

    if (empId) {
        filtrado = filtrado.filter(u => u.empId == empId || u.emp_id == empId || u.emp === get("filtroEmpreendimento").selectedOptions[0].text);
    }

    if (blocoId) {
        filtrado = filtrado.filter(u => u.bloco === get("filtroBloco").selectedOptions[0].text);
    }

    ChaveVR.atualizarCardsDash(filtrado);
    ChaveVR.preencherTabelaDash(filtrado);
}

function limparFiltros() {
    get("filtroEmpreendimento").value = "";
    get("filtroBloco").innerHTML = `<option value="">Selecione o Bloco</option>`;

    ChaveVR.atualizarCardsDash(listaCompleta);
    ChaveVR.preencherTabelaDash(listaCompleta);
}

function cardFiltro(tipo) {
    const filtrado = ChaveVR.filtrarPorCard(listaCompleta, tipo);
    ChaveVR.atualizarCardsDash(filtrado);
    ChaveVR.preencherTabelaDash(filtrado);
}

</script>

</body>
</html>
