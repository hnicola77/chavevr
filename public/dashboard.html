<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard – ChaveVR</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/chavesvr.js"></script>
</head>

<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
    </div>

    <div class="container">
        <h1>Dashboard – ChaveVR</h1>

        <!-- FILTROS -->
        <div class="filtros">
            <select id="filtroEmpreendimento">
                <option value="">Empreendimento</option>
            </select>

            <select id="filtroBloco">
                <option value="">Bloco</option>
            </select>

            <button class="btn-secondary" onclick="aplicarFiltro()">Aplicar Filtro</button>
        </div>

        <!-- CARDS -->
        <div class="cards">

            <div class="card" onclick="filtrarCard('total')">
                <h3>Total</h3>
                <p id="cardTotal">0</p>
            </div>

            <div class="card" onclick="filtrarCard('pendentes')">
                <h3>Pendentes</h3>
                <p id="cardPendentes">0</p>
            </div>

            <div class="card" onclick="filtrarCard('liberadas')">
                <h3>Liberadas</h3>
                <p id="cardLiberadas">0</p>
            </div>

            <div class="card" onclick="filtrarCard('reprovadas')">
                <h3>Aprovadas</h3>
                <p id="cardReprovadas">0</p>
            </div>

            <div class="card" onclick="filtrarCard('entregues')">
                <h3>Chaves Entregues</h3>
                <p id="cardChaves">0</p>
            </div>

            <div class="card" onclick="filtrarCard('cvco')">
                <h3>CVCO Liberado</h3>
                <p id="cardCVCO">0</p>
            </div>
        </div>

        <!-- TABELA -->
        <table>
            <thead>
                <tr>
                    <th>Empreendimento</th>
                    <th>Bloco</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                </tr>
            </thead>

            <tbody id="tabelaDash"></tbody>
        </table>

    </div>


<script>
let listaCompleta = [];

/****************************************************
 * INICIALIZAR DASHBOARD
 ****************************************************/
document.addEventListener("DOMContentLoaded", async () => {

    // Carrega empreendimentos no filtro
    await ChaveVR.carregarEmpreendimentosSelect("filtroEmpreendimento");

    // Carrega tudo
    listaCompleta = await ChaveVR.initDashboard();
});

/****************************************************
 * QUANDO MUDA O EMPREENDIMENTO → CARREGAR BLOCOS
 ****************************************************/
get("filtroEmpreendimento").addEventListener("change", async (e) => {
    await ChaveVR.carregarBlocosSelect("filtroBloco", e.target.value);
});

/****************************************************
 * APLICAR FILTRO (EMP + BLOCO)
 ****************************************************/
function aplicarFiltro() {
    const empId = get("filtroEmpreendimento").value;
    const blocoId = get("filtroBloco").value;

    let filtrada = [...listaCompleta];

    if (empId) filtrada = filtrada.filter(u => u.emp_id == empId);
    if (blocoId) filtrada = filtrada.filter(u => u.bloco_id == blocoId);

    ChaveVR.preencherTabelaDash(filtrada);
}

/****************************************************
 * FILTRO PELOS CARDS
 ****************************************************/
function filtrarCard(tipo) {
    const lista = ChaveVR.filtrarPorCard(listaCompleta, tipo);
    ChaveVR.preencherTabelaDash(lista);
}

</script>

</body>
</html>
