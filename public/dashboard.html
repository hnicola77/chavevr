<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - ChaveVR</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="topbar">
    <h1>Dashboard - ChaveVR</h1>
    <div class="top-actions">
      <button class="btn primary" id="btnExportar">📊 Exportar Excel</button>
    </div>
  </div>

  <!-- CARDS -->
  <div class="dashboard-container">
    <section class="cards-grid">
      <div class="dash-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="dash-card-title" style="color: rgba(255,255,255,0.9);">📊 Total Unidades</div>
        <div class="dash-card-value" style="color: #ffffff;" id="cardTotal">0</div>
      </div>

      <div class="dash-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <div class="dash-card-title" style="color: rgba(255,255,255,0.9);">🔑 Chaves Entregues</div>
        <div class="dash-card-value" style="color: #ffffff;" id="cardEntregues">0</div>
        <div class="dash-card-subtitle" style="color: rgba(255,255,255,0.8);" id="cardEntreguesPercent"></div>
      </div>

      <div class="dash-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
        <div class="dash-card-title" style="color: rgba(255,255,255,0.9);">⏳ Pendentes</div>
        <div class="dash-card-value" style="color: #ffffff;" id="cardPendentes">0</div>
        <div class="dash-card-subtitle" style="color: rgba(255,255,255,0.8);" id="cardPendentesPercent"></div>
      </div>

      <div class="dash-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
        <div class="dash-card-title" style="color: rgba(255,255,255,0.9);">✅ Liberadas</div>
        <div class="dash-card-value" style="color: #ffffff;" id="cardLiberadas">0</div>
        <div class="dash-card-subtitle" style="color: rgba(255,255,255,0.8);" id="cardLiberadasPercent"></div>
      </div>

      <div class="dash-card" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
        <div class="dash-card-title" style="color: rgba(255,255,255,0.9);">👍 Aprovadas</div>
        <div class="dash-card-value" style="color: #ffffff;" id="cardAprovadas">0</div>
        <div class="dash-card-subtitle" style="color: rgba(255,255,255,0.8);" id="cardAprovadasPercent"></div>
      </div>
    </section>

    <!-- GRÁFICOS -->
    <div class="dashboard-grid-2col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px;">
      <section class="dash-section">
        <h3 style="margin: 0 0 16px;">Distribuição por Situação</h3>
        <canvas id="chartSituacao" width="400" height="300"></canvas>
      </section>

      <section class="dash-section">
        <h3 style="margin: 0 0 16px;">Status de Entrega</h3>
        <canvas id="chartEntrega" width="400" height="300"></canvas>
      </section>
    </div>
  </div>

  <!-- FILTROS - ADICIONADAS TODAS AS COLUNAS -->
  <div class="filters">
    <div class="filter-row">
      <!-- Busca Rápida -->
      <label>
        🔍 Busca Rápida
        <input type="text" id="filtroBuscaRapida" placeholder="Digite bloco ou unidade..." />
      </label>

      <!-- Empreendimento -->
      <label>
        🏢 Empreendimento
        <select id="filtroEmpreendimento">
          <option value="">Todos</option>
        </select>
      </label>

      <!-- Bloco -->
      <label>
        🏗️ Bloco
        <select id="filtroBloco">
          <option value="">Todos</option>
        </select>
      </label>

      <!-- Situação -->
      <label>
        📋 Situação
        <select id="filtroSituacao">
          <option value="">Todas</option>
        </select>
      </label>

      <!-- Chaves -->
      <label>
        🔑 Chaves
        <select id="filtroChaves">
          <option value="">Todas</option>
        </select>
      </label>

      <!-- ✨ NOVO: Financeiro -->
      <label>
        💰 Financeiro
        <select id="filtroFinanceiro">
          <option value="">Todos</option>
        </select>
      </label>

      <!-- ✨ NOVO: Habitável -->
      <label>
        ✅ Habitável
        <select id="filtroHabitavel">
          <option value="">Todos</option>
        </select>
      </label>

      <!-- ✨ NOVO: Vistoria -->
      <label>
        👁️ Vistoria
        <select id="filtroVistoria">
          <option value="">Todas</option>
        </select>
      </label>

      <!-- ✨ NOVO: Liberação -->
      <label>
        🎉 Liberação
        <select id="filtroLiberacao">
          <option value="">Todas</option>
        </select>
      </label>

      <button class="btn primary" id="btnAplicarFiltros">Aplicar</button>
      <button class="btn" id="btnLimparTudo">🗑️ Limpar Tudo</button>
    </div>
  </div>

  <!-- TABELA -->
  <div class="table-container">
    <div id="emptyMessage" class="empty-message" style="display: none;">
      Nenhuma unidade encontrada.
    </div>

    <table id="tabelaUnidades">
      <thead>
        <tr>
          <th>Empreendimento</th>
          <th>Bloco</th>
          <th>Unidade</th>
          <th>Situação</th>
          <th>Financeiro</th>
          <th>Habitável</th>
          <th>Chaves</th>
          <th>Vistoria</th>
          <th>Liberação</th>
        </tr>
      </thead>
      <tbody id="corpoTabela">
        <!-- Linhas inseridas via JS -->
      </tbody>
    </table>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
