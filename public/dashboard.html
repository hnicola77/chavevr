<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard – ChaveVR</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/dashboard.js" defer></script>
</head>

<body>

<div class="top-menu">
    <a href="/index.html">Módulos</a>
    <a href="/cadastro_unidades.html">Cadastro de Unidades</a>
    <a class="ativo" href="/dashboard.html">Dashboard</a>
</div>

<div class="container">

    <h1>Dashboard – ChaveVR</h1>

    <!-- CARDS -->
    <div class="cards">
        <div class="card" id="cardTotal"><h2>Total</h2><p>0</p></div>
        <div class="card" id="cardEntregues"><h2>Entregues</h2><p>0</p></div>
        <div class="card" id="cardPendentes"><h2>Pendentes</h2><p>0</p></div>
        <div class="card" id="cardLiberadas"><h2>Liberadas</h2><p>0</p></div>
        <div class="card" id="cardAprovadas"><h2>Aprovadas</h2><p>0</p></div>
        <div class="card" id="cardCVCO"><h2>CVCO</h2><p>0</p></div>
    </div>

    <!-- FILTROS -->
    <div class="filtros">

        <select id="fEmpreendimento">
            <option value="">Empreendimento</option>
            <option>New Jersey</option>
            <option>Honolulu</option>
            <option>Plaza de Espanha</option>
            <option>Plaza Valencia</option>
            <option>Boulevard Fecile</option>
            <option>Federico Fellini</option>
        </select>

        <select id="fBloco">
            <option value="">Bloco</option>
        </select>

        <select id="fSituacao">
            <option value="">Situação</option>
            <option>Em obra</option>
            <option>Ajuste de cliente</option>
            <option>Liberada</option>
            <option>Aprovada</option>
        </select>

        <button class="btn-secondary" onclick="aplicarFiltro()">Filtrar</button>
    </div>

    <!-- TABELA -->
    <table>
        <thead>
            <tr>
                <th>Empreendimento</th>
                <th>Bloco</th>
                <th>Unidade</th>
                <th>Situação</th>
                <th>Financeiro</th>
                <th>Habitável</th>
                <th>CVCO</th>
                <th>Chaves</th>
                <th>Vistoria</th>
                <th>Liberação</th>
            </tr>
        </thead>

        <tbody id="tabelaDash"></tbody>
    </table>

</div>

</body>
</html>
