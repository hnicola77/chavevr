<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Dashboard</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background:#f4f6f9;
            margin:0;
            font-family:Arial, sans-serif;
        }

        /* Menu superior */
        .top-menu {
            display:flex;
            justify-content:flex-end;
            gap:20px;
            padding:15px 30px;
            background:white;
            border-bottom:1px solid #ddd;
        }
        .top-menu a {
            text-decoration:none;
            color:#333;
            font-weight:bold;
        }

        /* Cards */
        .cards {
            display:flex;
            gap:20px;
            margin-top:25px;
            flex-wrap:wrap;
        }
        .card {
            flex:1;
            min-width:180px;
            background:white;
            border-radius:12px;
            padding:20px;
            text-align:center;
            box-shadow:0 2px 8px rgba(0,0,0,0.12);
            cursor:pointer;
        }
        .card h3 {
            margin:0;
            color:#666;
            font-size:16px;
        }
        .card p {
            margin-top:8px;
            font-size:26px;
            font-weight:bold;
            color:#000;
        }

        /* Filtros */
        .filters {
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.12);
            display:flex;
            gap:10px;
            margin-top:25px;
            flex-wrap:wrap;
        }
        select {
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:14px;
        }
        .btn-secondary {
            padding:10px 14px;
            background:#6c757d;
            border:none;
            border-radius:6px;
            color:white;
            cursor:pointer;
            font-weight:bold;
        }

        /* Tabela */
        table {
            width:100%;
            margin-top:20px;
            border-collapse:collapse;
            background:white;
            border-radius:8px;
            overflow:hidden;
            box-shadow:0 2px 8px rgba(0,0,0,0.12);
        }
        th, td {
            padding:10px;
            border-bottom:1px solid #eee;
            text-align:left;
            font-size:13px;
        }
        th {
            background:#fafafa;
        }

        /* Cores (controladas pelo JS) */
        tr.verde { background:#d6ffd6 !important; }
        tr.amarelo { background:#fff4cc !important; }
        tr.vermelho { background:#ffd6d6 !important; }

        .container {
            max-width:1200px;
            margin:30px auto;
        }

    </style>
</head>
<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
        <a href="/cadastro_blocos.html">Blocos</a>
        <a href="/cadastro_unidades.html">Unidades</a>
        <a href="/index.html">Módulos</a>
    </div>

    <div class="container">

        <h1>Dashboard – ChaveVR</h1>

        <!-- CARDS -->
        <div class="cards">
            <div class="card" onclick="filtrarCard('total')">
                <h3>Total de Unidades</h3>
                <p id="card-total">0</p>
            </div>

            <div class="card" onclick="filtrarCard('emObra')">
                <h3>Em Obra</h3>
                <p id="card-emObra">0</p>
            </div>

            <div class="card" onclick="filtrarCard('ajuste')">
                <h3>Ajuste Cliente</h3>
                <p id="card-ajuste">0</p>
            </div>

            <div class="card" onclick="filtrarCard('liberadas')">
                <h3>Liberadas</h3>
                <p id="card-liberadas">0</p>
            </div>

            <div class="card" onclick="filtrarCard('aprovadas')">
                <h3>Aprovadas</h3>
                <p id="card-aprovadas">0</p>
            </div>

            <div class="card" onclick="filtrarCard('entregues')">
                <h3>Chaves Entregues</h3>
                <p id="card-chaves">0</p>
            </div>

            <div class="card" onclick="filtrarCard('cvco')">
                <h3>CVCO Liberado</h3>
                <p id="card-cvco">0</p>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="filters">
            <select id="filtroEmpreendimento">
                <option value="">Empreendimento</option>
            </select>

            <select id="filtroBloco">
                <option value="">Bloco</option>
            </select>

            <select id="filtroSituacao">
                <option value="">Situação</option>
                <option value="Em obra">Em obra</option>
                <option value="Ajuste de cliente">Ajuste de cliente</option>
                <option value="Liberada">Liberada</option>
                <option value="Aprovada">Aprovada</option>
            </select>

            <select id="filtroFinanceiro">
                <option value="">Status Financeiro</option>
                <option value="Liberada">Liberada</option>
                <option value="Bloqueada">Bloqueada</option>
            </select>

            <select id="filtroHabitavel">
                <option value="">Habitável</option>
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>

            <select id="filtroCVCO">
                <option value="">CVCO</option>
                <option value="Liberado">Liberado</option>
                <option value="Pendente">Pendente</option>
            </select>

            <select id="filtroChaves">
                <option value="">Chaves</option>
                <option value="Entregue">Entregue</option>
                <option value="Não entregue">Não entregue</option>
            </select>

            <button class="btn-secondary" onclick="aplicarFiltrosDashboard()">Buscar</button>
        </div>

        <!-- TABELA -->
        <table>
            <thead>
                <tr>
                    <th>Empreendimento</th>
                    <th>Bloco</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                </tr>
            </thead>

            <tbody id="dashTable">
                <!-- Preenchido via JS -->
            </tbody>
        </table>

    </div>

    <script src="/chavesvr.js"></script>
</body>
</html>
