<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard – ChaveVR</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- MENU SUPERIOR -->
    <header class="top-menu">
        <a href="index.html" class="menu-link">Voltar</a>
        <a href="#" class="menu-link">Relatório</a>
        <a href="/../index.html" class="menu-link">Sair</a>
    </header>

    <div class="dashboard-container">

        <!-- TÍTULO -->
        <h1>Dashboard - ChaveVR</h1>

        <!-- BOTÃO CADASTRAR -->
        <div class="top-actions">
            <a href="cadastro.html" class="btn-primary">+ Cadastrar Unidade</a>
        </div>

        <!-- SELECT EMPREENDIMENTO -->
        <div class="filtro-empreendimento">
            <select id="filtroEmpreendimento">
                <option selected>Selecione o Empreendimento</option>
            </select>
        </div>

        <!-- CARDS -->
        <div class="cards">
            <div class="card"><h3>Total</h3><p id="card-total">0</p></div>
            <div class="card"><h3>Pendentes</h3><p id="card-pendentes">0</p></div>
            <div class="card"><h3>Liberadas</h3><p id="card-liberadas">0</p></div>
            <div class="card"><h3>Reprovadas</h3><p id="card-reprovadas">0</p></div>
            <div class="card"><h3>Chaves Entregues</h3><p id="card-chaves">0</p></div>
            <div class="card"><h3>CVCO Liberado</h3><p id="card-cvco">0</p></div>
        </div>

        <!-- FILTROS -->
        <div class="filters">
            <select id="fSituacao">
                <option value="">Situação</option>
                <option>Pendente</option>
                <option>Liberada</option>
                <option>Reprovada</option>
            </select>

            <select id="fStatusFinanceiro">
                <option value="">Status Financeiro</option>
                <option>Ok</option>
                <option>Pendente</option>
            </select>

            <select id="fCVCO">
                <option value="">CVCO</option>
                <option>Liberado</option>
                <option>Pendente</option>
            </select>

            <select id="fHabiteSe">
                <option value="">Habite-se</option>
                <option>Liberado</option>
                <option>Pendente</option>
            </select>

            <input type="date" id="fDataVistoria">

            <button class="btn-secondary" onclick="buscar()">Buscar</button>
        </div>

        <!-- TABELA -->
        <div class="tabela-container">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>Empreendimento</th>
                        <th>Bloco</th>
                        <th>Pavimento</th>
                        <th>Unidade</th>
                        <th>Situação</th>
                        <th>Status Financeiro</th>
                        <th>Habite-se</th>
                        <th>CVCO</th>
                        <th>Chaves</th>
                        <th>Data Vistoria</th>
                        <th>Hora</th>
                        <th>Data Liberação</th>
                        <th>Agendado Por</th>
                        <th>Obs</th>
                    </tr>
                </thead>
                <tbody id="tabela-unidades"></tbody>
            </table>
        </div>

    </div>

    <!-- SCRIPT CORRETO -->
    <script src="/chavesvr.js"></script>
</body>
</html>
