<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>ChaveVR – Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/chavesvr.js"></script>
</head>

<body>

    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/cadastro_empreendimentos.html">Empreendimentos</a>
        <a href="/cadastro_blocos.html">Blocos</a>
        <a href="/cadastro_unidades.html">Unidades</a>
    </div>

    <div class="container">

        <h1>Dashboard – ChaveVR</h1>
        <p>Visão geral das unidades cadastradas.</p>

        <!-- FILTROS -->
        <div class="filtros">
            <select id="filtroEmpreendimento">
                <option value="">Empreendimento</option>
            </select>

            <select id="filtroBloco">
                <option value="">Bloco</option>
            </select>

            <button class="btn-secondary" onclick="aplicarFiltros()">Aplicar</button>
            <button class="btn-secondary" onclick="limparFiltros()">Limpar</button>
        </div>

        <!-- CARDS -->
        <div class="cards">
            <div class="card" onclick="filtrarCard('total')">
                <h3>Total</h3><p id="cardTotal">0</p>
            </div>
            <div class="card" onclick="filtrarCard('pendentes')">
                <h3>Pendentes</h3><p id="cardPendentes">0</p>
            </div>
            <div class="card" onclick="filtrarCard('liberadas')">
                <h3>Liberadas</h3><p id="cardLiberadas">0</p>
            </div>
            <div class="card" onclick="filtrarCard('reprovadas')">
                <h3>Aprovadas</h3><p id="cardReprovadas">0</p>
            </div>
            <div class="card" onclick="filtrarCard('entregues')">
                <h3>Chaves Entregues</h3><p id="cardChaves">0</p>
            </div>
            <div class="card" onclick="filtrarCard('cvco')">
                <h3>CVCO</h3><p id="cardCVCO">0</p>
            </div>
        </div>

        <!-- TABELA -->
        <table>
            <thead>
                <tr>
                    <th>Empreendimento</th>
                    <th>Bloco</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                </tr>
            </thead>
            <tbody id="tabelaDash"></tbody>
        </table>

    </div>

<script>
let listaCompleta = [];

// INICIAR DASHBOARD
document.addEventListener("DOMContentLoaded", async () => {

    // carregar empreendimentos no filtro
    await ChaveVR.carregarEmpreendimentosSelect("filtroEmpreendimento");

    // carregar todas as unidades completas
    listaCompleta = await (await fetch("/unidades_completas")).json();

    atualizarDashboard(listaCompleta);
});

// FUNÇÃO PRINCIPAL
function atualizarDashboard(lista) {
    atualizarCards(lista);
    preencherTabela(lista);
}

// CARDS
function atualizarCards(lista) {

    get("cardTotal").innerText = lista.length;

    get("cardPendentes").innerText =
        lista.filter(u => u.situacao === "Em obra" || u.situacao === "Ajuste de cliente").length;

    get("cardLiberadas").innerText =
        lista.filter(u => u.situacao === "Liberada").length;

    get("cardReprovadas").innerText =
        lista.filter(u => u.situacao === "Aprovada").length;

    get("cardChaves").innerText =
        lista.filter(u => u.chaves === "Entregue").length;

    get("cardCVCO").innerText =
        lista.filter(u => u.cvco === "Liberado").length;
}

// TABELA
function preencherTabela(lista) {
    const tbody = get("tabelaDash");
    tbody.innerHTML = "";

    lista.forEach(u => {
        const tr = document.createElement("tr");
        tr.className = corUnidade(u);

        tr.innerHTML = `
            <td>${u.emp_nome}</td>
            <td>${u.bloco_nome}</td>
            <td>${u.unidade}</td>
            <td>${u.situacao}</td>
            <td>${u.statusFinanceiro}</td>
            <td>${u.habitavel}</td>
            <td>${u.cvco}</td>
            <td>${u.chaves}</td>
            <td>${u.dataVistoria || ""}</td>
            <td>${u.dataLiberacao || ""}</td>
        `;

        tbody.appendChild(tr);
    });
}

// FILTROS
async function aplicarFiltros() {
    const empId = get("filtroEmpreendimento").value;
    const blocoNome = get("filtroBloco").value;

    let lista = [...listaCompleta];

    if (empId)
        lista = lista.filter(u => u.emp_id == empId);

    if (blocoNome)
        lista = lista.filter(u => u.bloco_nome == blocoNome);

    atualizarDashboard(lista);

    // carregar blocos
    if (empId)
        await ChaveVR.carregarBlocosSelect("filtroBloco", empId);
}

function limparFiltros() {
    get("filtroEmpreendimento").value = "";
    get("filtroBloco").innerHTML = `<option value="">Bloco</option>`;
    atualizarDashboard(listaCompleta);
}

function filtrarCard(tipo) {
    const lista = ChaveVR.filtrarPorCard(listaCompleta, tipo);
    atualizarDashboard(lista);
}

</script>
</body>
</html>
