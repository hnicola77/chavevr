<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard – ChaveVR</title>
    
    <link rel="stylesheet" href="/styles.css"> 
    
    <script src="/dashboard.js" defer></script>
</head>

<body>

    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/cadastro_unidades.html">Cadastro de Unidades</a>
        <a class="ativo" href="/dashboard.html">Dashboard</a>
    </div>

    <div class="container">

        <h1>Dashboard - ChaveVR</h1>

        <div class="cards">
            <div id="cardTotal" class="card" style="background-color:#ffe0b2;">
                <h2>Total Unidades</h2>
                <p>0</p>
            </div>
            <div id="cardEntregues" class="card" style="background-color:#ff7070; color:white;">
                <h2>Chaves Entregues</h2>
                <p>0</p>
            </div>
            <div id="cardPendentes" class="card" style="background-color:#9fa8da;">
                <h2>Unidades Pendentes</h2>
                <p>0</p>
            </div>
            <div id="cardLiberadas" class="card" style="background-color:#81c784;">
                <h2>Liberadas (Obra)</h2>
                <p>0</p>
            </div>
            <div id="cardAprovadas" class="card" style="background-color:#4db6ac;">
                <h2>Vistorias Aprovadas</h2>
                <p>0</p>
            </div>
            <div id="cardCVCO" class="card" style="background-color:#4fc3f7;">
                <h2>CVCO Liberado</h2>
                <p>0</p>
            </div>
        </div>

        <div class="filtros">
            <select id="fEmpreendimento" onchange="aplicarFiltro()">
                </select>
            
            <select id="fBloco" onchange="aplicarFiltro()">
                </select>

            <select id="fSituacao" onchange="aplicarFiltro()">
                <option value="">Situação</option>
                <option value="Em obra">Em obra</option>
                <option value="Ajuste de cliente">Ajuste de cliente</option>
                <option value="Liberada">Liberada</option>
                <option value="Aprovada">Aprovada</option>
            </select>

            <button class="btn-primary" onclick="aplicarFiltro()">Filtrar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Empreendimento</th>
                    <th>Bloco</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                </tr>
            </thead>
            <tbody id="tabelaDash">
                </tbody>
        </table>

    </div>

</body>
</html>
