<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard – ChaveVR</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/chavesvr.js"></script>
</head>

<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/cadastro_completo.html">Cadastro Completo</a>
        <a href="/dashboard.html">Dashboard</a>
    </div>

    <div class="container">

        <h1>Dashboard – Controle de Unidades</h1>

        <!-- FILTROS -->
        <div class="filtros">
            <select id="filtroEmp" onchange="carregarBlocosFiltro()">
                <option value="">Empreendimento</option>
            </select>

            <select id="filtroBloco">
                <option value="">Bloco</option>
            </select>

            <button class="btn-primary" onclick="aplicarFiltro()">Filtrar</button>
        </div>

        <!-- CARDS -->
        <div class="cards">
            <div class="card" onclick="filtrarCard('todas')">
                <h3>Total</h3>
                <p id="cardTotal">0</p>
            </div>

            <div class="card" onclick="filtrarCard('pendentes')">
                <h3>Pendentes</h3>
                <p id="cardPendentes">0</p>
            </div>

            <div class="card" onclick="filtrarCard('liberadas')">
                <h3>Liberadas</h3>
                <p id="cardLiberadas">0</p>
            </div>

            <div class="card" onclick="filtrarCard('aprovadas')">
                <h3>Aprovadas</h3>
                <p id="cardAprovadas">0</p>
            </div>

            <div class="card" onclick="filtrarCard('entregues')">
                <h3>Chaves Entregues</h3>
                <p id="cardChaves">0</p>
            </div>

            <div class="card" onclick="filtrarCard('cvco')">
                <h3>CVCO Liberado</h3>
                <p id="cardCVCO">0</p>
            </div>
        </div>

        <!-- TABELA -->
        <table>
            <thead>
                <tr>
                    <th>Empreendimento</th>
                    <th>Bloco</th>
                    <th>Unidade</th>
                    <th>Situação</th>
                    <th>Financeiro</th>
                    <th>Habitável</th>
                    <th>CVCO</th>
                    <th>Chaves</th>
                    <th>Vistoria</th>
                    <th>Liberação</th>
                </tr>
            </thead>

            <tbody id="tabelaDash"></tbody>
        </table>

    </div>

<script>

/****************************************************
 * CARREGAR EMPREENDIMENTOS PARA FILTRO
 ****************************************************/
document.addEventListener("DOMContentLoaded", async () => {
    await carregarEmpreendimentosSelect("filtroEmp");
    listarDashboard();
});

async function carregarBlocosFiltro() {
    const empId = get("filtroEmp").value;
    await carregarBlocosSelect("filtroBloco", empId);
}

/****************************************************
 * BUSCAR TODAS UNIDADES COMPLETAS
 ****************************************************/
let unidadesTodas = [];

async function listarDashboard() {
    const res = await fetch("/unidades_completas");
    unidadesTodas = await res.json();

    atualizarCards(unidadesTodas);
    preencherTabela(unidadesTodas);
}

/****************************************************
 * ATUALIZAR CARDS
 ****************************************************/
function atualizarCards(lista) {
    get("cardTotal").innerText = lista.length;

    get("cardPendentes").innerText =
        lista.filter(u => u.situacao === "Em obra" || u.situacao === "Ajuste de cliente").length;

    get("cardLiberadas").innerText =
        lista.filter(u => u.situacao === "Liberada").length;

    get("cardAprovadas").innerText =
        lista.filter(u => u.situacao === "Aprovada").length;

    get("cardChaves").innerText =
        lista.filter(u => u.chaves === "Entregue").length;

    get("cardCVCO").innerText =
        lista.filter(u => u.cvco === "Liberado").length;
}

/****************************************************
 * PREENCHER TABELA
 ****************************************************/
function preencherTabela(lista) {
    const tbody = get("tabelaDash");
    tbody.innerHTML = "";

    lista.forEach(u => {
        const tr = document.createElement("tr");
        tr.classList.add(definirCor(u));

        tr.innerHTML = `
            <td>${u.emp_nome}</td>
            <td>${u.bloco_nome}</td>
            <td>${u.unidade}</td>
            <td>${u.situacao}</td>
            <td>${u.statusFinanceiro}</td>
            <td>${u.habitavel}</td>
            <td>${u.cvco}</td>
            <td>${u.chaves}</td>
            <td>${u.dataVistoria || ""}</td>
            <td>${u.dataLiberacao || ""}</td>
        `;

        tbody.appendChild(tr);
    });
}

/****************************************************
 * CORES DAS UNIDADES
 ****************************************************/
function definirCor(u) {
    if (u.chaves === "Entregue") return "verde";
    if (["Liberada", "Aprovada"].includes(u.situacao) && u.chaves === "Não entregue") return "amarelo";
    return "vermelho";
}

/****************************************************
 * FILTROS
 ****************************************************/
function aplicarFiltro() {
    const emp = get("filtroEmp").value;
    const bloco = get("filtroBloco").value;

    let lista = [...unidadesTodas];

    if (emp) lista = lista.filter(u => u.emp_id == emp);
    if (bloco) lista = lista.filter(u => u.bloco_id == bloco);

    atualizarCards(lista);
    preencherTabela(lista);
}

function filtrarCard(tipo) {
    let lista = [...unidadesTodas];

    switch (tipo) {
        case "pendentes":
            lista = lista.filter(u => u.situacao === "Em obra" || u.situacao === "Ajuste de cliente");
            break;
        case "liberadas":
            lista = lista.filter(u => u.situacao === "Liberada");
            break;
        case "aprovadas":
            lista = lista.filter(u => u.situacao === "Aprovada");
            break;
        case "entregues":
            lista = lista.filter(u => u.chaves === "Entregue");
            break;
        case "cvco":
            lista = lista.filter(u => u.cvco === "Liberado");
            break;
    }

    atualizarCards(lista);
    preencherTabela(lista);
}

</script>

</body>
</html>
