<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Empreendimentos</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>

<!-- NAV SUPERIOR -->
<div class="top-menu">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/cadastro_blocos.html">Blocos</a>
    <a href="/cadastro_unidades.html">Unidades</a>
    <a href="/index.html">Módulos</a>
</div>

<div class="container">

    <h1>Cadastro de Empreendimentos</h1>
    <p>Gerencie todos os empreendimentos cadastrados.</p>

    <!-- FORMULÁRIO -->
    <h2 id="formTitulo">Novo Empreendimento</h2>

    <form id="formEmp">
        <input type="hidden" id="empId">

        <label>Nome do Empreendimento</label>
        <input type="text" id="nomeEmp" required>

        <div class="row">
            <div>
                <label>Cidade</label>
                <input type="text" id="cidadeEmp">
            </div>
            <div>
                <label>UF</label>
                <input type="text" id="ufEmp" maxlength="2">
            </div>
            <div>
                <label>Data de Entrega</label>
                <input type="date" id="dataEntregaEmp">
            </div>
        </div>

        <div class="row">
            <div>
                <label>Fase</label>
                <input type="text" id="faseEmp">
            </div>
            <div>
                <label>Código Interno</label>
                <input type="text" id="codigoEmp">
            </div>
        </div>

        <label>Observações</label>
        <textarea id="obsEmp"></textarea>

        <br>
        <button type="submit" class="btn-primary" id="btnSalvarEmp">Salvar</button>
        <button type="button" class="btn-secondary" id="btnCancelarEmp" style="display:none;" onclick="cancelarEdicaoEmp()">Cancelar</button>
    </form>

    <hr style="margin:40px 0;">

    <!-- LISTAGEM -->
    <h2>Empreendimentos Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Empreendimento</th>
                <th>Cidade</th>
                <th>UF</th>
                <th>Fase</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaEmp"></tbody>
    </table>

</div>

<script>
// HELPERS
function get(id) { return document.getElementById(id); }
function limparEmpForm() {
    get("empId").value = "";
    get("nomeEmp").value = "";
    get("cidadeEmp").value = "";
    get("ufEmp").value = "";
    get("dataEntregaEmp").value = "";
    get("faseEmp").value = "";
    get("codigoEmp").value = "";
    get("obsEmp").value = "";
}

// LISTAR
async function carregarEmpreendimentos() {
    const res = await fetch("/empreendimentos");
    return await res.json();
}

async function preencherTabelaEmp() {
    const lista = await carregarEmpreendimentos();
    const tbody = get("tabelaEmp");
    tbody.innerHTML = "";

    lista.forEach(emp => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${emp.id}</td>
            <td>${emp.nome}</td>
            <td>${emp.cidade}</td>
            <td>${emp.uf}</td>
            <td>${emp.fase}</td>
            <td>
                <button class="btn-small btn-editar" onclick="editarEmp(${emp.id})">Editar</button>
                <button class="btn-small btn-unidades" onclick="abrirBlocos(${emp.id})">Blocos</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// ABRIR BLOCOS
function abrirBlocos(idEmp) {
    window.location.href = `/cadastro_blocos.html?emp=${idEmp}`;
}

// SALVAR
get("formEmp").addEventListener("submit", async (e) => {
    e.preventDefault();

    const emp = {
        nome: get("nomeEmp").value,
        cidade: get("cidadeEmp").value,
        uf: get("ufEmp").value,
        fase: get("faseEmp").value,
        dataEntrega: get("dataEntregaEmp").value,
        codigoInterno: get("codigoEmp").value,
        observacao: get("obsEmp").value
    };

    const id = get("empId").value;

    if (id === "") {
        await fetch("/empreendimentos", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(emp)
        });
        alert("Empreendimento criado!");
    } else {
        await fetch(`/empreendimentos/${id}`, {
            method: "PUT",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(emp)
        });
        alert("Empreendimento atualizado!");
    }

    cancelarEdicaoEmp();
    preencherTabelaEmp();
});

// EDITAR
async function editarEmp(id) {
    const res = await fetch("/empreendimentos");
    const lista = await res.json();
    const emp = lista.find(e => e.id == id);

    get("empId").value = emp.id;
    get("nomeEmp").value = emp.nome;
    get("cidadeEmp").value = emp.cidade;
    get("ufEmp").value = emp.uf;
    get("faseEmp").value = emp.fase;
    get("dataEntregaEmp").value = emp.dataEntrega;
    get("codigoEmp").value = emp.codigoInterno;
    get("obsEmp").value = emp.observacao;

    get("formTitulo").innerText = "Editar Empreendimento";
    get("btnSalvarEmp").innerText = "Atualizar";
    get("btnCancelarEmp").style.display = "inline-block";
}

// CANCELAR
function cancelarEdicaoEmp() {
    limparEmpForm();
    get("formTitulo").innerText = "Novo Empreendimento";
    get("btnSalvarEmp").innerText = "Salvar";
    get("btnCancelarEmp").style.display = "none";
}

// INICIAR
preencherTabelaEmp();
</script>

</body>
</html>
