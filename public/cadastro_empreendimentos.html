<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Empreendimentos – ChaveVR</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/chavesvr.js"></script>
</head>

<body>

    <!-- MENU -->
    <div class="top-menu">
        <a href="/index.html">Módulos</a>
        <a href="/dashboard.html">Dashboard</a>
    </div>

    <div class="container">

        <h1>Cadastro de Empreendimentos</h1>

        <!-- FORM -->
        <form id="formEmpreendimento" onsubmit="salvarEmpreendimento(event)">
            <input type="hidden" id="id" />

            <label>Nome do Empreendimento</label>
            <input id="nome" required>

            <div class="row">
                <div>
                    <label>Cidade</label>
                    <input id="cidade">
                </div>

                <div>
                    <label>UF</label>
                    <input id="uf" maxlength="2">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Fase</label>
                    <input id="fase">
                </div>

                <div>
                    <label>Data de Entrega</label>
                    <input type="date" id="dataEntrega">
                </div>
            </div>

            <label>Código Interno</label>
            <input id="codigoInterno">

            <label>Observações</label>
            <textarea id="observacao"></textarea>

            <button class="btn-primary" style="margin-top:20px;">Salvar</button>
        </form>

        <hr style="margin:30px 0">

        <h2>Empreendimentos Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cidade</th>
                    <th>UF</th>
                    <th>Fase</th>
                    <th>Entrega</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaEmpreendimentos"></tbody>
        </table>

    </div>

<script>
/**********************************************
 * CARREGAR LISTA
 **********************************************/
document.addEventListener("DOMContentLoaded", async () => {
    await listarEmpreendimentos();
});

/**********************************************
 * LISTAR EMPREENDIMENTOS
 **********************************************/
async function listarEmpreendimentos() {
    const res = await fetch("/empreendimentos");
    const lista = await res.json();

    const tbody = get("tabelaEmpreendimentos");
    tbody.innerHTML = "";

    lista.forEach(emp => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${emp.nome}</td>
            <td>${emp.cidade || ""}</td>
            <td>${emp.uf || ""}</td>
            <td>${emp.fase || ""}</td>
            <td>${emp.dataEntrega || ""}</td>

            <td>
                <button class="btn-small btn-editar" onclick='editar(${JSON.stringify(emp)})'>Editar</button>
                <a class="btn-small btn-unidades" href="/cadastro_blocos.html?emp=${emp.id}">Blocos</a>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

/**********************************************
 * EDITAR EMPREENDIMENTO
 **********************************************/
function editar(emp) {
    get("id").value = emp.id;
    get("nome").value = emp.nome;
    get("cidade").value = emp.cidade || "";
    get("uf").value = emp.uf || "";
    get("fase").value = emp.fase || "";
    get("dataEntrega").value = emp.dataEntrega || "";
    get("codigoInterno").value = emp.codigoInterno || "";
    get("observacao").value = emp.observacao || "";
}

/**********************************************
 * SALVAR EMPREENDIMENTO
 **********************************************/
async function salvarEmpreendimento(e) {
    e.preventDefault();

    const id = get("id").value;

    const dados = {
        nome: get("nome").value,
        cidade: get("cidade").value,
        uf: get("uf").value,
        fase: get("fase").value,
        dataEntrega: get("dataEntrega").value,
        codigoInterno: get("codigoInterno").value,
        observacao: get("observacao").value
    };

    const metodo = id ? "PUT" : "POST";
    const url = id ? `/empreendimentos/${id}` : "/empreendimentos";

    await fetch(url, {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
    });

    alert("Empreendimento salvo com sucesso!");

    get("formEmpreendimento").reset();
    get("id").value = "";

    listarEmpreendimentos();
}

</script>

</body>
</html>
