<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ChaveVR - Cadastro de Empreendimentos</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background:#f4f6f9;
            margin:0;
            font-family:Arial, sans-serif;
        }
        .top-menu {
            display:flex;
            justify-content:flex-end;
            gap:20px;
            padding:15px 30px;
            background:#fff;
            border-bottom:1px solid #ddd;
        }
        .top-menu a {
            text-decoration:none;
            color:#333;
            font-weight:bold;
        }
        .container {
            max-width:1100px;
            margin:30px auto;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,0.12);
        }
        h1, h2 {
            margin-top:0;
            color:#333;
        }
        label {
            display:block;
            margin-top:10px;
            font-weight:bold;
            color:#444;
        }
        input, textarea {
            width:100%;
            padding:10px;
            margin-top:5px;
            border-radius:6px;
            border:1px solid #ccc;
            font-size:14px;
        }
        textarea {
            resize:vertical;
            min-height:80px;
        }
        .row {
            display:flex;
            gap:15px;
        }
        .row > div {
            flex:1;
        }
        .btn-primary {
            background:#007bff;
            padding:10px 18px;
            border-radius:6px;
            color:white;
            text-decoration:none;
            font-weight:bold;
            border:none;
            cursor:pointer;
        }
        .btn-secondary {
            background:#6c757d;
            padding:10px 18px;
            border-radius:6px;
            color:white;
            border:none;
            font-weight:bold;
            cursor:pointer;
        }
        table {
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
            background:white;
        }
        th, td {
            padding:10px;
            border-bottom:1px solid #eee;
            text-align:left;
            font-size:13px;
        }
        th {
            background:#f7f7f7;
            font-weight:bold;
        }
        .action-btn {
            padding:5px 12px;
            font-size:13px;
            border-radius:4px;
            border:none;
            cursor:pointer;
        }
        .btn-blocos {
            background:#17a2b8;
            color:white;
        }
    </style>
</head>
<body>

    <!-- MENU SUPERIOR -->
    <div class="top-menu">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/cadastro_blocos.html">Blocos</a>
        <a href="/index.html">Módulos</a>
    </div>

    <!-- CONTAINER -->
    <div class="container">
        <h1>Cadastro de Empreendimentos</h1>
        <p>Cadastre os empreendimentos. Depois cadastre os blocos e unidades.</p>

        <!-- FORMULÁRIO -->
        <h2>Novo Empreendimento</h2>
        <form id="formEmp">
            <label>Nome do Empreendimento</label>
            <input type="text" id="nomeEmp" required>

            <div class="row">
                <div>
                    <label>Cidade</label>
                    <input type="text" id="cidadeEmp">
                </div>
                <div>
                    <label>UF</label>
                    <input type="text" id="ufEmp" maxlength="2">
                </div>
                <div>
                    <label>Data de Entrega</label>
                    <input type="date" id="dataEntregaEmp">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Fase / Situação</label>
                    <input type="text" id="faseEmp">
                </div>
                <div>
                    <label>Código Interno</label>
                    <input type="text" id="codigoEmp">
                </div>
            </div>

            <label>Observações</label>
            <textarea id="obsEmp"></textarea>

            <br>
            <button class="btn-primary" type="submit">Salvar Empreendimento</button>
        </form>

        <!-- LISTAGEM -->
        <h2 style="margin-top:40px;">Empreendimentos Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Empreendimento</th>
                    <th>Cidade</th>
                    <th>UF</th>
                    <th>Fase</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaEmp">
                <!-- conteúdo preenchido via chavesvr.js -->
            </tbody>
        </table>
    </div>

    <script src="/chavesvr.js"></script>

</body>
</html>
